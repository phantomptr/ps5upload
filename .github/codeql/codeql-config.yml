# CodeQL looks at code that ships in the app, the engine and the helper. Tests, examples,
# fuzzers, the hardware lab tool and the developer scripts never reach a user: their fixed test
# keys, debug prints and one-off file handling only produced noise.
name: ps5upload
paths-ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/examples/**"
  - "**/fuzz/**"
  - "engine/crates/ps5upload-ctest/**"
  - "engine/crates/ps5upload-tests/**"
  - "engine/crates/ps5upload-lab/**"
  - "client/e2e/**"
  - "scripts/**"
  - "bench/**"
  # Generated single-file builds of client/src (vite.join / vite.pad configs): CodeQL scans their
  # sources there; in the minified copy it misreads bounds (the frame wait capped at 10 s).
  - "engine/crates/ps5upload-engine/src/join_page.html"
  - "engine/crates/ps5upload-engine/src/pad_page.html"
  - "site/join/index.html"
  - "site/pad/index.html"
