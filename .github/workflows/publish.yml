name: publish

# The release artifact builder. Fires automatically on every `vX.Y.Z`
# tag push (the normal release path, driven by scripts/release.sh) and
# can also be dispatched by hand for the same tag.
#
# Dual trigger, on purpose:
#   * push: tags  -> the tag push from a release cuts the GitHub Release
#                    with no extra step to remember. (`ci` deliberately
#                    ignores tags via `tags-ignore`, so this is the only
#                    workflow that reacts to a tag.)
#   * workflow_dispatch -> manual override. The predecessor `release.yml`
#                    was deleted because GitHub's tag-push trigger can
#                    land a run in an uncancellable pre-queue state
#                    during an Actions outage, and new tag pushes won't
#                    fire fresh runs while it's wedged. Keeping a manual
#                    dispatch here means that even if a tag-push run
#                    wedges, you can still ship by re-dispatching:
#                      gh workflow run publish.yml -f tag=v2.17.0
#                    (or the Actions UI "Run workflow" button).
#
# See https://github.com/orgs/community/discussions/51410 for the
# upstream wedge symptom + the "create+merge a PR to nudge repo
# activity" workaround when a queued workflow_id won't accept
# cancel/dispatch.
#
# Tag resolution: `github.event.inputs.tag || github.ref_name` — the
# dispatch input when present, otherwise the pushed tag's name. Every
# interpolation of that value into a shell run-block goes through
# `env: INPUT_TAG:` indirection. Action `with:` parameters and
# YAML-level keys (concurrency.group, checkout ref) are not shell
# contexts and are safe by construction. The `Resolve tag` step also
# regex-validates the tag before anything downstream consumes it.
# See https://securitylab.github.com/research/github-actions-untrusted-input/
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v2.17.0). The tag must already exist."
        required: true
      # release-tag.yml passes its own input on. A tag push (no inputs) is always a pre-release.
      prerelease:
        description: "Publish as a pre-release (promote by hand after a console test). Off: the release is the latest at once."
        type: boolean
        default: true

# Only create-release writes (its own grant below): the build jobs run npm ci, Gradle, CocoaPods
# and downloaded tooling, which have no use for a token that can change the repository.
permissions:
  contents: read
  # scripts/release/wait-for-artifact.mjs reads this run's artifacts and jobs.
  actions: read

# Distinct group for publish runs so manual dispatches and tag pushes
# for the same version cancel superseded publish attempts without
# touching the normal ci workflow.
concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-payload:
    name: build-payload
    runs-on: ubuntu-24.04
    # 45: the converter's Docker toolchain is built here when engine-ci's cache of it is gone.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # Always the newest 22.x (security releases; the runner image can lag).
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Every binary below takes its version from VERSION, so a tag that says
      # otherwise would ship assets named for one version reporting another.
      # Checked here, in the first job, so nothing is built for a bad tag.
      - name: Tag must match VERSION
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          raw_tag="$INPUT_TAG"
          if ! echo "$raw_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+._A-Za-z0-9]*)?$'; then
            echo "::error::Refusing to proceed: '$raw_tag' does not look like a version tag"
            exit 1
          fi
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "v$expected" != "$raw_tag" ]; then
            echo "::error::VERSION says '$expected' but the tag is '$raw_tag'. Fix VERSION (scripts/update-version.js) and cut the next version; a pushed tag cannot be moved."
            exit 1
          fi
          echo "tag $raw_tag matches VERSION $expected"

      # The release step below always says pre-release, and updating an existing release takes
      # those flags: a re-dispatch would pull a promoted release from the stable update channel
      # and swap its files under the people already on it.
      - name: Refuse to rebuild a promoted release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Only "there is no such release" (HTTP 404) lets the build go on. Any other answer
          # (rate limit, 5xx, no network) is not a no: it is asked again, then the job fails,
          # because guessing "not promoted" is what would overwrite a promoted release.
          err="$RUNNER_TEMP/release-lookup.err"
          for attempt in 1 2 3; do
            if prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" --jq .prerelease 2>"$err")"; then
              if [ "$prerelease" = false ]; then
                echo "::error::$INPUT_TAG is already promoted. Cut the next version, or first make it a pre-release again: gh release edit $INPUT_TAG --prerelease"
                exit 1
              fi
              if [ "$prerelease" != true ]; then
                echo "::error::unexpected answer for release $INPUT_TAG: '$prerelease'"
                exit 1
              fi
              echo "$INPUT_TAG exists as a pre-release; rebuilding it."
              exit 0
            fi
            if grep -q 'HTTP 404' "$err"; then
              echo "No release for $INPUT_TAG yet."
              exit 0
            fi
            echo "release lookup failed (attempt $attempt):" >&2
            cat "$err" >&2
            sleep $((attempt * 10))
          done
          echo "::error::could not tell whether $INPUT_TAG is already promoted (GitHub API error above); not building over it."
          exit 1

      - name: Sync version from VERSION
        run: node scripts/update-version.js

      - name: Install payload toolchain
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Add LLVM apt repo for llvm-22 (not in Ubuntu 24.04 default repos)
          sudo bash scripts/install-llvm-apt.sh 22
          # See the note on the Tauri prerequisites step: bounded and retried,
          # so a stalled mirror cannot hold the job (scripts/ci-apt.sh). Through
          # ci-apt-latest.sh, here and in every apt step of this workflow: it runs main's copy
          # of ci-apt.sh, so a mirror fix made after this tag was cut reaches a re-run of it
          # (v12.6.6 was tagged and could never be published: its own copy kept failing).
          bash scripts/ci-apt-latest.sh clang-22 llvm-22-dev lld-22 unzip python3

      - name: Install pinned PS5 Payload SDK
        run: sudo env PS5_SDK_INSTALL_DIR=/opt/ps5-payload-sdk bash scripts/install-ps5-sdk.sh

      # make payload embeds the console web page (payload/Makefile: build/webui_page.c runs
      # `npm run build:console` in client/), so the client's dependencies must be installed.
      - name: Install client deps (console web page)
        working-directory: client
        run: npm ci --no-audit --no-fund

      # The converter the helper carries (payload/convert), built in Docker. Its toolchain image
      # comes from engine-ci's cache when main has saved one (same key); else build.sh builds it.
      # Not saved from here: a tag's cache is not one later runs read.
      - name: Restore the converter's toolchain image
        id: convert-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/convert-toolchain.tar
          key: ${{ runner.os }}-${{ runner.arch }}-convert-toolchain-${{ hashFiles('payload/convert/Dockerfile', 'payload/convert/prepare-rust-std.py', 'scripts/ps5-sdk.env') }}

      - name: Load the converter's toolchain image
        if: steps.convert-image.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/convert-toolchain.tar"

      - name: Build the converter (make console-convert)
        timeout-minutes: 20
        env:
          DOCKER_BUILDKIT: 1
        run: make console-convert

      - name: Build payload ELF
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          # The SDK's prospero-llvm-config only looks for LLVM versions it knows,
          # so point it at the CI-installed LLVM 22 explicitly.
          LLVM_CONFIG: /usr/bin/llvm-config-22
          # A release never ships a helper without the converter: payload/Makefile fails the
          # build when payload/convert/ps5upload-convert.elf is missing.
          CONVERT_REQUIRED: 1
        run: make payload

      - name: Sanity-check ELF shape
        run: |
          file payload/ps5upload.elf payload/installer/ps5upload-installer.elf
          test -s payload/ps5upload.elf
          test -s payload/installer/ps5upload-installer.elf
          gzip -t payload/ps5upload.elf.gz payload/installer/ps5upload-installer.elf.gz
          # The helper must be this release's version: a stale ELF embedded in the app is sent to
          # consoles as the current helper (the app then never sends it by itself, and says so).
          make check-helper-version

      - name: Gzip payloads for bundling
        run: |
          gzip -kf payload/ps5upload.elf payload/installer/ps5upload-installer.elf
          ls -la \
            payload/ps5upload.elf payload/ps5upload.elf.gz \
            payload/installer/ps5upload-installer.elf payload/installer/ps5upload-installer.elf.gz

      - name: Upload payload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ps5upload-payload
          path: |
            payload/ps5upload.elf
            payload/ps5upload.elf.gz
            payload/installer/ps5upload-installer.elf
            payload/installer/ps5upload-installer.elf.gz
          if-no-files-found: error

  # No `needs: build-payload`: setup (checkout, Node, Rust, npm ci, apt) runs while the payload
  # builds, and the "Wait for the payload ELF" step holds the job just before the first step
  # that reads the ELFs (the engine embeds them). A failed build-payload (bad tag, broken C)
  # fails that step, so nothing is compiled for it; create-release still needs every job.
  build-client:
    name: build-client-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # The Intel macOS runner took ~33 min for v5.35/5.36 and ran past 45 on
    # v5.37.0, cancelling the whole release (create-release needs every build).
    # 100 = the 75 a build may take plus the 25 minutes the payload wait gained (20 -> 45,
    # scripts/release/wait-for-artifact.mjs): a wait for a queued build-payload must not eat
    # the build's own time.
    timeout-minutes: 100
    env:
      # "true" once the Azure Artifact Signing secrets are set (scripts/release/azure-sign.ps1).
      # A step cannot read secrets in its `if`, so the switch is here.
      WINDOWS_SIGNING: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
          # Cross-compiled on the Apple-silicon runner: the same x86_64-apple-darwin target,
          # toolchain and flags as on the Intel runner, so the same x64 app and engine (rustc
          # and Apple clang emit for the --target, not the host). The Intel runner compiled
          # ~1.6x slower (engine 688 s vs 438 s, v7.1.20) and its queue started it ~3 min late.
          - os: macos-15
            platform: macos
            arch: x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            platform: windows
            arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # Always the newest 22.x (security releases; the runner image can lag).
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Sync version from VERSION
        run: node scripts/update-version.js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # Compile cache, read-only. A cache a tag run saves is visible to that tag alone, so
      # saving here never helped a later release (it filled the shared 10 GiB and evicted CI's
      # caches); what a tag run CAN read is main's. release-cache.yml runs this job's exact
      # engine + desktop-dependency build on main with sccache writing, so the hundreds of
      # dependency crates (and unchanged first-party ones) come from the cache here and only
      # what changed, the final links and LTO are compiled. sccache never fails the build: a
      # cache it cannot reach is a miss (SCCACHE_IGNORE_SERVER_IO_ERROR), and a server that
      # does not start leaves cargo without the wrapper. Same three steps in release-cache.yml
      # and ci's engine-target job (where they were measured).
      # The registry key is the locks' registry/git crates only (.github/scripts/cargo-cache.mjs),
      # so the release's version bump, which lives on the tag and not on main, still hits the
      # entry release-cache saved on main.
      - name: Cargo registry cache key
        id: cache-key
        shell: bash
        run: node .github/scripts/cargo-cache.mjs key engine/Cargo.lock client/src-tauri/Cargo.lock >> "$GITHUB_OUTPUT"

      - name: Restore cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ steps.cache-key.outputs.deps }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install sccache
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: sccache@0.18.0

      - name: Point sccache at the Actions cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            // The v2 cache service (the only one GitHub runs now); without this sccache's
            // backend speaks v1, and every read misses and every write fails.
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('SCCACHE_ERROR_LOG', `${process.env.RUNNER_TEMP}/sccache.log`);
            core.exportVariable('SCCACHE_LOG', 'warn');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'true');
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_ONLY');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            core.exportVariable('SCCACHE_IDLE_TIMEOUT', '0');

      - name: Start sccache
        shell: bash
        # Not on Windows: since Rust 1.100's build-dir layout rustc gets one -L per dependency,
        # and sccache 0.18 starts rustc with the whole line, past Windows' limit (os error 206).
        # Cargo alone passes it in a response file. Turn back on once sccache does the same.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "::notice::sccache is off on Windows (Rust 1.100 command lines are too long for it)"
          elif sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without the compile cache"
          fi

      # Bounded and retried on purpose. During the v5.3.3 publish this step
      # stalled inside apt for 45 minutes, ate the whole job budget, and took
      # the release down with it — every other platform had already built
      # fine. A hung mirror should cost one short retry, not the release, so
      # the step gets its own timeout well under the job's 45.
      #
      # Per-connection timeouts were not enough: with the Azure mirror slow
      # rather than dead, each package waited out its own timeout and the
      # first of the three attempts used the whole step. scripts/ci-apt.sh
      # puts each download attempt on a 4-minute clock, leaves the Azure
      # mirror after a failed one, and installs offline once the files are in.
      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          bash scripts/ci-apt-latest.sh \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            patchelf \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - name: Ensure libclang for bindgen (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # jpegxr's build runs bindgen, which loads libclang.dll into the
          # HOST build process. windows-2022 ships LLVM; the leaner
          # windows-11-arm image may not. Locate a host-arch libclang and
          # pin LIBCLANG_PATH so clang-sys resolves it deterministically.
          # Non-destructive: when a usable LLVM is already present we only
          # export the path — a runner that already builds keeps working.
          set -u
          find_libclang() {
            for d in \
              "/c/Program Files/LLVM/bin" \
              "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/ARM64/bin" \
              "/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/Llvm/bin" \
              "/c/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/Llvm/ARM64/bin" \
              "/c/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/Llvm/bin"; do
              if [ -f "$d/libclang.dll" ]; then echo "$d"; return 0; fi
            done
            return 1
          }
          dir="$(find_libclang || true)"
          # Only auto-install on x64: choco's llvm is an x64 build and an
          # x64 libclang.dll can't load into an arm64 host process, so on
          # arm64 we rely on the image's preinstalled (arm64) LLVM above.
          if [ -z "$dir" ] && [ "$ARCH" = "x64" ]; then
            choco install llvm -y --no-progress
            dir="$(find_libclang || true)"
          fi
          if [ -n "$dir" ]; then
            win="$(cygpath -w "$dir")"
            echo "LIBCLANG_PATH=$win" >> "$GITHUB_ENV"
            echo "Using libclang at: $win"
          else
            echo "WARNING: no host libclang found; jpegxr/bindgen may fail" >&2
          fi

      # The desktop app's dependencies start compiling now, in the background, instead of with
      # the engine below: npm ci and the wait for the payload ELF left the CPU idle for 2-4 min
      # (Windows ARM64, the last leg, v12.6.3: 2.6 min). They read nothing from the payload; the
      # engine step picks this build up and waits for it (build-engine-release.sh). After the
      # Linux packages and LIBCLANG_PATH, which their build scripts need.
      - name: Start compiling the desktop app's dependencies
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: scripts/release/build-engine-release.sh --start-desktop-deps

      - name: Install client deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Wait for the payload ELF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/wait-for-artifact.mjs ps5upload-payload build-payload

      - name: Restore payload ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ps5upload-payload
          path: payload

      - name: Verify payload resource in place
        shell: bash
        run: |
          test -s payload/ps5upload.elf.gz
          test -s payload/installer/ps5upload-installer.elf.gz
          ls -la payload/ps5upload.elf.gz payload/installer/ps5upload-installer.elf.gz

      - name: Build engine sidecar binary
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        # The engine and its RAR helper, with the desktop app's dependencies pre-built
        # alongside (the script says why). release-cache.yml runs the same script on main,
        # so this build reads its dependencies from the compile cache.
        run: scripts/release/build-engine-release.sh

      - name: Verify engine binary in place
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          target_root="engine/target/${RUST_TARGET}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -s "$target_root/ps5upload-engine.exe"
            test -s "$target_root/ps5upload-unrar.exe"
            ls -la "$target_root/ps5upload-engine.exe" "$target_root/ps5upload-unrar.exe"
          else
            test -s "$target_root/ps5upload-engine"
            test -s "$target_root/ps5upload-unrar"
            ls -la "$target_root/ps5upload-engine" "$target_root/ps5upload-unrar"
          fi
          # The helper must not be a stub: it answers --version on the native runners
          # (every leg but macOS x64, which is cross-built on Apple silicon and runs
          # under Rosetta when present).
          helper="$target_root/ps5upload-unrar"
          [ "$RUNNER_OS" = "Windows" ] && helper="$helper.exe"
          "$helper" --version || [ "$RUST_TARGET" = x86_64-apple-darwin ]

      # Windows signing (Azure Artifact Signing) — only when the secrets exist; otherwise
      # releases ship unsigned exactly as before. The engine exe and the RAR helper exe are signed
      # here because the app embeds them; the app exe and the installer are signed by Tauri's
      # signCommand below.
      - name: Sign the engine (Windows, when signing is set up)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          ./scripts/release/azure-sign.ps1 "engine/target/$env:RUST_TARGET/release/ps5upload-engine.exe"
          ./scripts/release/azure-sign.ps1 "engine/target/$env:RUST_TARGET/release/ps5upload-unrar.exe"

      # Tauri downloads these itself with no checksum (the appimage plugin from a moving
      # "continuous" release). Pinned URLs and SHA-256s, put in its cache first, so the build
      # runs only these files.
      - name: Fetch the AppImage tools (pinned, checksummed; Linux only)
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            x64)   tools_arch=x86_64 ;;
            arm64) tools_arch=aarch64 ;;
            *) echo "::error::no AppImage tools for $ARCH"; exit 1 ;;
          esac
          ./scripts/release/appimage-tools.sh "$tools_arch"

      - name: Diagnose linuxdeploy (Linux only)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: ${{ matrix.arch }}
        run: |
          set +e
          cd "$RUNNER_TEMP"
          case "$ARCH" in
            x64)   tools_arch=x86_64 ;;
            arm64) tools_arch=aarch64 ;;
          esac
          # The build's own linuxdeploy, verified by the step above (a copy: the bundler patches its file).
          cp "${XDG_CACHE_HOME:-$HOME/.cache}/tauri/linuxdeploy-07333c6-$tools_arch.AppImage" linuxdeploy
          chmod +x linuxdeploy
          echo "=== linuxdeploy --version (direct) ==="
          ./linuxdeploy --version
          rc=$?
          echo "=== linuxdeploy exit code: $rc ==="
          if [ $rc -ne 0 ]; then
            echo "=== retry with extract-and-run explicit ==="
            ./linuxdeploy --appimage-extract-and-run --version
          fi
          exit 0

      - name: Build Tauri bundle
        working-directory: client
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          RUST_TARGET: ${{ matrix.rust_target }}
          PLATFORM: ${{ matrix.platform }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          LINUXDEPLOY_VERBOSE: "1"
        run: |
          if [ "$PLATFORM" = "windows" ]; then
            # The raw exe AND the NSIS installer from one build. The NSIS
            # installer bundles the WebView2 bootstrapper, which is
            # essential on Windows 10 where WebView2 is not pre-installed
            # (issue #221: app shows in Task Manager but no window appears).
            # The raw exe is the one the bundler leaves in target/: it
            # compiles it, stamps it with the bundle type ("nsis") in place
            # and packs it. A separate --no-bundle build first only made the
            # second command compile the app crate again (208-294 s on
            # v7.1.20); the exe shipped was always the second, stamped one.
            # With signing set up, Tauri signs the app exe and the installer it makes.
            sign=()
            if [ -n "${AZURE_SIGNING_ACCOUNT:-}" ]; then
              script="$(cygpath -w "$GITHUB_WORKSPACE/scripts/release/azure-sign.ps1")"
              sign=(--config "$(node -e 'console.log(JSON.stringify({bundle:{windows:{signCommand:{cmd:"pwsh",args:["-NoProfile","-File",process.argv[1],"%1"]}}}}))' "$script")")
            fi
            build=(npx tauri build --target "$RUST_TARGET" --ci --bundles nsis "${sign[@]}")
          else
            build=(npx tauri build --target "$RUST_TARGET" --ci --verbose)
          fi
          # Bundling depends on things outside this repo: GitHub's downloads (a 504 fetching
          # AppRun failed 11.2.2) and the runner's disk images ("hdiutil: Resource busy" failed
          # 11.1.0). A try costs little: the compile is already done. A real error fails three times.
          for try in 1 2 3; do
            if "${build[@]}"; then exit 0; fi
            [ "$try" = 3 ] && break
            echo "::warning::tauri build failed (try $try of 3), trying again"
            if [ "$PLATFORM" = "macos" ]; then
              for v in /Volumes/PS5Upload* /Volumes/dmg.*; do
                [ -e "$v" ] && hdiutil detach "$v" -force || true
              done
            fi
            sleep $((try * 30))
          done
          exit 1

      - name: Compile cache stats
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          tail -n 20 "$RUNNER_TEMP/sccache.log" 2>/dev/null || true

      - name: Collect bundle artefacts
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          dist_abs="$PWD/dist"
          mkdir -p "$dist_abs"
          target_root="client/src-tauri/target/${RUST_TARGET}/release"
          bundle="$target_root/bundle"
          echo "Scanning $bundle"
          ls -R "$bundle" || true
          case "$PLATFORM" in
            macos)
              dmg="$(find "$bundle" -type f -name "*.dmg" | head -n1)"
              if [ -z "$dmg" ]; then
                echo "::error::no .dmg produced by tauri"
                exit 1
              fi
              # An image with a licence agreement can't be opened by the app's own updater.
              if hdiutil imageinfo "$dmg" | grep -q "Software License Agreement: true"; then
                echo "::error::the .dmg has a licence agreement, so auto-update would fail"
                exit 1
              fi
              cp -v "$dmg" "$dist_abs/"
              ;;
            linux)
              app="$(find "$bundle" -type f -name "*.AppImage" | head -n1)"
              if [ -z "$app" ]; then
                echo "::error::no .AppImage produced by tauri"
                exit 1
              fi
              staging="$(mktemp -d)"
              cp -v "$app" "$staging/PS5Upload.AppImage"
              chmod +x "$staging/PS5Upload.AppImage"
              cp -v scripts/release/linux-launcher.sh "$staging/PS5Upload.sh"
              chmod +x "$staging/PS5Upload.sh"
              cp -v LICENSE "$staging/LICENSE"
              (cd "$staging" && zip -9 "$dist_abs/PS5Upload.zip" PS5Upload.AppImage PS5Upload.sh LICENSE)
              rm -rf "$staging"
              # The bare AppImage too, for AppImage managers (Shelly, Gear Lever, AppImageLauncher):
              # it applies the launcher's Wayland + NVIDIA fix itself (linux_gpu.rs).
              cp -v "$app" "$dist_abs/PS5Upload.AppImage"
              chmod +x "$dist_abs/PS5Upload.AppImage"
              deb="$(find "$bundle" -type f -name "*.deb" | head -n1)"
              if [ -z "$deb" ]; then
                echo "::error::no .deb produced by tauri"
                exit 1
              fi
              cp -v "$deb" "$dist_abs/PS5Upload.deb"
              rpm="$(find "$bundle" -type f -name "*.rpm" | head -n1)"
              if [ -z "$rpm" ]; then
                echo "::error::no .rpm produced by tauri"
                exit 1
              fi
              cp -v "$rpm" "$dist_abs/PS5Upload.rpm"
              ;;
            windows)
              raw_exe="$target_root/ps5upload-desktop.exe"
              if [ ! -f "$raw_exe" ]; then
                echo "::error::raw .exe not found at $raw_exe"
                ls -la "$target_root" || true
                exit 1
              fi
              staging="$dist_abs/_stage"
              mkdir -p "$staging"
              cp -v "$raw_exe" "$staging/PS5Upload.exe"
              cp -v LICENSE "$staging/LICENSE"
              rm -f "$dist_abs/PS5Upload.zip"
              # PowerShell, rather than Bash, expands the $env variables below.
              # shellcheck disable=SC2016
              PS5UP_EXE="$staging/PS5Upload.exe" \
              PS5UP_LICENSE="$staging/LICENSE" \
              PS5UP_ZIP="$dist_abs/PS5Upload.zip" \
                pwsh -NoProfile -Command 'Compress-Archive -LiteralPath $env:PS5UP_EXE,$env:PS5UP_LICENSE -DestinationPath $env:PS5UP_ZIP -CompressionLevel Optimal'
              rm -rf "$staging"
              # Also ship the NSIS installer (includes WebView2 bootstrapper
              # for Windows 10 users who don't have Edge/WebView2 installed).
              nsis_setup="$(find "$bundle" -type f -name "*-setup.exe" 2>/dev/null | head -n1)"
              if [ -n "$nsis_setup" ] && [ -f "$nsis_setup" ]; then
                cp -v "$nsis_setup" "$dist_abs/PS5Upload-setup.exe"
              else
                # Windows 10 users need it (#221); a release without it is a
                # broken release, not a warning.
                echo "::error::NSIS installer not found (WebView2 bootstrapper not bundled)"
                exit 1
              fi
              ;;
          esac
          # Ship the engine sidecar binary standalone too (it's also bundled
          # inside the app). Lets users run/inspect the engine on its own and
          # keeps a per-OS/arch engine artifact on every release.
          # The RAR helper goes with it: the engine looks for it next to its own binary.
          eng_root="engine/target/${RUST_TARGET}/release"
          if [ "$PLATFORM" = windows ]; then
            cp -v "$eng_root/ps5upload-engine.exe" "$dist_abs/ps5upload-engine.exe"
            cp -v "$eng_root/ps5upload-unrar.exe" "$dist_abs/ps5upload-unrar.exe"
          else
            cp -v "$eng_root/ps5upload-engine" "$dist_abs/ps5upload-engine"
            cp -v "$eng_root/ps5upload-unrar" "$dist_abs/ps5upload-unrar"
          fi
          ls -la "$dist_abs"

      - name: Upload platform bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ps5upload-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Android APK. The engine is linked in-process (no sidecar), the real
  # payload (from build-payload) is embedded, and we build one release APK
  # per ABI (arm64, and 32-bit armv7 for older phones) then sign them (see
  # android-sign.sh). The release native library is built without its symbol
  # table (CARGO_PROFILE_RELEASE_STRIP), which took ~24 MB off arm64; Gradle
  # can't strip it (no ndkVersion in the generated project) and debug builds
  # from `make run-android` keep their symbols.
  # Signing uses the ANDROID_KEYSTORE_* repo secrets (stable signature →
  # seamless updates). Without them the sign step fails and the release
  # ships no APK: one signed with a throwaway key could not update the
  # app people already have.
  # ─────────────────────────────────────────────────────────────────────
  build-android:
    name: build-android
    # Starts with build-payload and waits for its ELFs (see build-client).
    runs-on: ubuntu-24.04
    # Above the payload wait (45, wait-for-artifact.mjs) plus the timed steps below (5 + 25)
    # and ~10 of setup, so neither a long runner queue nor a hang cancels the job.
    timeout-minutes: 90
    # The Android port is newer than the desktop builds, and the desktop
    # bundles are the shipped product. If the Android pipeline flakes (NDK
    # rotation, Gradle, signing), the release must still go out — create-
    # release's asset step already guards the APK copy with `if [ -f … ]`,
    # so a missing APK just means "no Android asset this release".
    #
    # We keep continue-on-error so a flaky Android build doesn't block the
    # release, but we emit a prominent warning annotation (last step) so the
    # failure is never silent.
    #
    # continue-on-error covers a FAILED job, not a job that hits its
    # timeout-minutes: that one is reported as cancelled, and create-release
    # `needs` this job, so a hung Gradle would have cancelled the whole
    # release. The long steps therefore carry their own timeouts, which turn
    # a hang into a step failure that continue-on-error does cover.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # Always the newest 22.x (security releases; the runner image can lag).
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Sync version from VERSION
        run: node scripts/update-version.js

      - name: Setup JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's dependency cache. The release APK build has the same
      # exposure that failed CI on v5.4.5: Maven Central answered 403
      # for kotlin-stdlib and Gradle could not configure the project.
      # That run happened to succeed here; caching removes the luck.
      # Restore only: a tag run can read main's caches (CI's android job saves this one once per
      # Tauri CLI version, the same key as here), but what a tag run saves is visible to
      # that tag alone. Saving here put a ~650 MB cache nobody could use into the shared 10 GiB on
      # every release and pushed CI's cargo caches out (the same reason this job has no cargo cache).
      - name: Gradle cache key
        id: gradle-key
        run: node .github/scripts/cargo-cache.mjs tauri-cli client/package-lock.json >> "$GITHUB_OUTPUT"

      - name: Restore Gradle dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-${{ steps.gradle-key.outputs.key }}
          restore-keys: ${{ runner.os }}-android-gradle-

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install client deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Wait for the payload ELF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/wait-for-artifact.mjs ps5upload-payload build-payload

      - name: Restore real payload ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ps5upload-payload
          path: payload

      - name: Verify payload resource in place
        shell: bash
        run: |
          test -s payload/ps5upload.elf.gz
          test -s payload/installer/ps5upload-installer.elf.gz
          ls -la payload/ps5upload.elf.gz payload/installer/ps5upload-installer.elf.gz

      - name: Resolve NDK
        shell: bash
        run: |
          PREFERRED_MAJOR="27"
          ndk=""
          for candidate in \
            "$ANDROID_HOME/ndk/${PREFERRED_MAJOR}."* \
            "$ANDROID_HOME/ndk/"*; do
            if [ -d "$candidate" ]; then
              ndk="$candidate"
              break
            fi
          done
          if [ -z "$ndk" ]; then
            echo "::error::no NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          case "$(basename "$ndk")" in
            "${PREFERRED_MAJOR}"*) ;;
            *) echo "::warning::preferred NDK r${PREFERRED_MAJOR} not found, using $(basename "$ndk")" ;;
          esac
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK: $ndk"

      - name: Scaffold Android project (gen/ is gitignored)
        working-directory: client
        timeout-minutes: 5
        run: npx tauri android init

      # Post-init manifest patches: (1) loopback-only cleartext so the
      # renderer can reach the in-process engine in release builds
      # (otherwise the engine shows "red"), and (2) backup rules so user
      # settings survive a reinstall.
      - name: Patch manifest (loopback cleartext + backup rules)
        run: bash scripts/release/android-postinit-patch.sh

      # ~11 min on v7.1.19; a hang fails the step (and only the step, see the
      # job's continue-on-error note) well inside the job's 40.
      - name: Build release APKs (arm64, armv7)
        working-directory: client
        timeout-minutes: 25
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: npx tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Sign APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/release/android-sign.sh

      - name: Check the APKs
        # armv7 is optional (android-sign.sh): only what was signed.
        run: |
          apks=()
          for apk in PS5Upload-android.apk PS5Upload-android-armv7.apk; do
            if [ -f "$apk" ]; then apks+=("$apk"); fi
          done
          python3 scripts/release/verify-android-apk.py "${apks[@]}"

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ps5upload-android
          path: |
            PS5Upload-android.apk
            PS5Upload-android-armv7.apk
          if-no-files-found: error

      # Last on purpose: `if: failure()` looks at the steps BEFORE it, so as
      # the second step it could never fire.
      - name: Warn if Android build fails
        if: failure()
        run: |
          echo "::warning::Android APK build failed — release will ship without an Android artifact. Check the build-android job logs."

  # ─────────────────────────────────────────────────────────────────────
  # iPhone .ipa, unsigned, for sideloading (AltStore, Sideloadly, a signing
  # service): the tool signs it with the user's own Apple ID, so no Apple
  # developer account is needed here. The engine runs in-process, as on
  # Android. Optional like the APK: a failure warns and the release ships.
  # ─────────────────────────────────────────────────────────────────────
  build-ios:
    name: build-ios
    # Starts with build-payload and waits for its ELFs (see build-client).
    runs-on: xcode-27
    # Above the payload wait (45, wait-for-artifact.mjs) plus the timed steps below (10 + 40)
    # and ~10 of setup.
    timeout-minutes: 110
    # Same reasoning as build-android: continue-on-error covers a failed job,
    # and the long steps carry their own timeouts so a hang fails a step
    # instead of cancelling the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Sync version from VERSION
        run: node scripts/update-version.js

      - name: Setup Rust + iOS target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          command -v xcodegen || brew install xcodegen
          command -v pod || brew install cocoapods

      - name: Install client deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Wait for the payload ELF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/wait-for-artifact.mjs ps5upload-payload build-payload

      - name: Restore real payload ELF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ps5upload-payload
          path: payload

      - name: Verify payload resource in place
        run: |
          test -s payload/ps5upload.elf.gz
          test -s payload/installer/ps5upload-installer.elf.gz

      - name: Scaffold iOS project (gen/ is gitignored)
        working-directory: client
        timeout-minutes: 10
        run: npx tauri ios init --ci

      - name: PS5Upload icons into the Xcode project
        run: bash scripts/release/ios-postinit-patch.sh

      # One retry when the runner's simulator service crashes under ibtool/actool (storyboard and
      # asset catalog compiles need it even for a device build): "Command CompileStoryboard failed"
      # with a CoreSimulator backtrace failed v12.6.6's first try. The service is restarted first;
      # any other failure is not retried.
      - name: Build unsigned IPA (arm64)
        working-directory: client
        timeout-minutes: 40
        run: |
          set -o pipefail
          if npx tauri ios build --ci --target aarch64 --no-sign 2>&1 | tee "$RUNNER_TEMP/ios-build.log"; then
            exit 0
          fi
          if ! grep -qE 'CoreSimulator|Command Compile(Storyboard|AssetCatalog[A-Za-z]*) failed' "$RUNNER_TEMP/ios-build.log"; then
            exit 1
          fi
          echo "::warning::the simulator service crashed during the iOS build; restarting it and trying once more"
          killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
          xcrun simctl list devices >/dev/null 2>&1 || true
          npx tauri ios build --ci --target aarch64 --no-sign

      - name: Check the IPA
        run: TAG_VERSION="$(tr -d '[:space:]' < VERSION)" python3 scripts/release/verify-ios-ipa.py PS5Upload-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ps5upload-ios
          path: PS5Upload-ios-unsigned.ipa
          if-no-files-found: error

      # Last on purpose: `if: failure()` looks at the steps before it.
      - name: Warn if iOS build fails
        if: failure()
        run: |
          echo "::warning::iOS IPA build failed — release will ship without an iPhone artifact. Check the build-ios job logs."

  # The release files' virus scan, beside the builds instead of after them: ClamAV and today's
  # signatures go in while the builds run, and each build's artifact is scanned as soon as it is
  # uploaded (scripts/release/scan-artifacts.mjs), so when the last build ends only its own files
  # are left. create-release took 6 min after the last build, 4.5 of them this scan (v12.6.3).
  # It hands create-release the SHA-256 of every file that scanned clean; create-release scans
  # every release file whose hash is not in that list (all of them if this job failed or found
  # something), so nothing ships unscanned whatever happens here. continue-on-error for the same
  # reason, with step timeouts under the job's so a hang is a failed step, not a cancelled job
  # (create-release needs this job, and a cancelled one would skip it).
  virus-scan:
    name: virus-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true
    steps:
      # Only the LICENSE (create-release ships the repo's copy) and the scan scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          sparse-checkout: |
            /LICENSE
            scripts/ci-apt.sh
            scripts/ci-apt-latest.sh
            scripts/release/clamscan-parallel.sh
            scripts/release/scan-artifacts.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true

      - name: Install ClamAV
        timeout-minutes: 20
        run: bash scripts/ci-apt-latest.sh clamav

      # The same rule as create-release: no scan with stale signatures.
      - name: Fetch current ClamAV signatures
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          fresh=0
          for attempt in 1 2 3; do
            if sudo freshclam --quiet; then
              fresh=1
              break
            fi
            echo "freshclam attempt $attempt failed" >&2
            sleep 20
          done
          if [ "$fresh" -ne 1 ]; then
            echo "::error::freshclam failed 3 times: no current virus signatures"
            exit 1
          fi
          for db in main daily; do
            if ! compgen -G "/var/lib/clamav/$db.c?d" >/dev/null; then
              echo "::error::/var/lib/clamav has no $db.cvd or $db.cld after freshclam"
              exit 1
            fi
          done

      # Ends when every build-* job has finished (builds can queue and run up to their 75-min
      # timeout), or at its own 100-min limit with what it has.
      - name: Scan each build's files as they arrive
        timeout-minutes: 110
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PS5UPLOAD_SCAN_MINUTES: "100"
        run: node scripts/release/scan-artifacts.mjs "$RUNNER_TEMP/clamav-scanned" LICENSE

      - name: Upload the list of files scanned clean
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clamav-scanned
          path: ${{ runner.temp }}/clamav-scanned/scanned.sha256
          if-no-files-found: error

  create-release:
    name: create-release
    needs:
      - build-payload
      - build-client
      - build-android
      - build-ios
      - virus-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      # attest-build-provenance: a signing token, and the attestation store.
      id-token: write
      attestations: write
    # ~10 min of release work plus the ClamAV scan (signature download and ~1 GB of files),
    # with room for a slow apt mirror's retries (scripts/ci-apt.sh).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          raw_tag="$INPUT_TAG"
          if ! echo "$raw_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+._A-Za-z0-9]*)?$'; then
            echo "::error::Refusing to proceed: '$raw_tag' does not look like a version tag"
            exit 1
          fi
          version="${raw_tag#v}"
          echo "tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$raw_tag version=$version"

      - name: Sanity-check tag vs VERSION file
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # build-payload already refused such a tag; this is the same rule
          # at the point of no return (the release is created right after).
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "$expected" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file says '$expected' but tag says '$TAG_VERSION'; the binaries report '$expected'."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Normalise release assets
        id: assets
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p release
          shopt -s nullglob
          for f in artifacts/ps5upload-macos-*/*.dmg; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-macos-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-mac-${arch}.dmg"
          done
          for f in artifacts/ps5upload-windows-*/PS5Upload.zip; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-windows-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-win-${arch}.zip"
          done
          # NSIS installer (includes WebView2 bootstrapper for Win10 users).
          for f in artifacts/ps5upload-windows-*/PS5Upload-setup.exe; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-windows-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-win-${arch}-setup.exe"
          done
          for f in artifacts/ps5upload-linux-*/PS5Upload.zip; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-linux-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-linux-${arch}.zip"
          done
          for f in artifacts/ps5upload-linux-*/PS5Upload.AppImage; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-linux-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-linux-${arch}.AppImage"
          done
          for f in artifacts/ps5upload-linux-*/PS5Upload.deb; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-linux-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-linux-${arch}.deb"
          done
          for f in artifacts/ps5upload-linux-*/PS5Upload.rpm; do
            arch="$(basename "$(dirname "$f")" | sed 's/^ps5upload-linux-//')"
            cp -v "$f" "release/PS5Upload-${TAG_VERSION}-linux-${arch}.rpm"
          done
          # The licence every download is under, for the files that cannot carry it themselves
          # (the standalone engine and the helper are bare programs).
          cp -v LICENSE release/LICENSE
          # Standalone engine binary per OS/arch (matches the desktop bundles).
          for f in artifacts/ps5upload-*/ps5upload-engine artifacts/ps5upload-*/ps5upload-engine.exe; do
            [ -f "$f" ] || continue
            pa="$(basename "$(dirname "$f")")"; pa="${pa#ps5upload-}"  # e.g. macos-aarch64
            ext=""; [ "${f##*.}" = exe ] && ext=".exe"
            cp -v "$f" "release/ps5upload-engine-${TAG_VERSION}-${pa}${ext}"
          done
          # Its RAR helper (ps5upload-unrar), to keep next to the standalone engine.
          for f in artifacts/ps5upload-*/ps5upload-unrar artifacts/ps5upload-*/ps5upload-unrar.exe; do
            [ -f "$f" ] || continue
            pa="$(basename "$(dirname "$f")")"; pa="${pa#ps5upload-}"
            ext=""; [ "${f##*.}" = exe ] && ext=".exe"
            cp -v "$f" "release/ps5upload-unrar-${TAG_VERSION}-${pa}${ext}"
          done
          if [ -f artifacts/ps5upload-payload/ps5upload.elf ]; then
            cp -v artifacts/ps5upload-payload/ps5upload.elf \
              "release/ps5upload-${TAG_VERSION}.elf"
          fi
          if [ -f artifacts/ps5upload-android/PS5Upload-android.apk ]; then
            cp -v artifacts/ps5upload-android/PS5Upload-android.apk \
              "release/PS5Upload-${TAG_VERSION}-android.apk"
          fi
          if [ -f artifacts/ps5upload-android/PS5Upload-android-armv7.apk ]; then
            cp -v artifacts/ps5upload-android/PS5Upload-android-armv7.apk \
              "release/PS5Upload-${TAG_VERSION}-android-armv7.apk"
          fi
          if [ -f artifacts/ps5upload-ios/PS5Upload-ios-unsigned.ipa ]; then
            cp -v artifacts/ps5upload-ios/PS5Upload-ios-unsigned.ipa \
              "release/PS5Upload-${TAG_VERSION}-ios-unsigned.ipa"
          fi
          echo "---release/ contents---"
          ls -la release
          count="$(find release -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The copies above are globs, so a build job that produced nothing
      # (or an artifact renamed on one side) used to ship as a release with a
      # hole in it and nothing red. Every platform asset is required; only the
      # APK and the IPA are optional (build-android and build-ios are continue-on-error by design).
      - name: Every expected asset is present
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          missing=0
          for name in \
            "PS5Upload-${TAG_VERSION}-mac-arm64.dmg" \
            "PS5Upload-${TAG_VERSION}-mac-x64.dmg" \
            "PS5Upload-${TAG_VERSION}-win-x64.zip" \
            "PS5Upload-${TAG_VERSION}-win-arm64.zip" \
            "PS5Upload-${TAG_VERSION}-win-x64-setup.exe" \
            "PS5Upload-${TAG_VERSION}-win-arm64-setup.exe" \
            "PS5Upload-${TAG_VERSION}-linux-x64.zip" \
            "PS5Upload-${TAG_VERSION}-linux-arm64.zip" \
            "PS5Upload-${TAG_VERSION}-linux-x64.AppImage" \
            "PS5Upload-${TAG_VERSION}-linux-arm64.AppImage" \
            "PS5Upload-${TAG_VERSION}-linux-x64.deb" \
            "PS5Upload-${TAG_VERSION}-linux-arm64.deb" \
            "PS5Upload-${TAG_VERSION}-linux-x64.rpm" \
            "PS5Upload-${TAG_VERSION}-linux-arm64.rpm" \
            "ps5upload-engine-${TAG_VERSION}-macos-arm64" \
            "ps5upload-engine-${TAG_VERSION}-macos-x64" \
            "ps5upload-engine-${TAG_VERSION}-linux-x64" \
            "ps5upload-engine-${TAG_VERSION}-linux-arm64" \
            "ps5upload-engine-${TAG_VERSION}-windows-x64.exe" \
            "ps5upload-engine-${TAG_VERSION}-windows-arm64.exe" \
            "ps5upload-unrar-${TAG_VERSION}-macos-arm64" \
            "ps5upload-unrar-${TAG_VERSION}-macos-x64" \
            "ps5upload-unrar-${TAG_VERSION}-linux-x64" \
            "ps5upload-unrar-${TAG_VERSION}-linux-arm64" \
            "ps5upload-unrar-${TAG_VERSION}-windows-x64.exe" \
            "ps5upload-unrar-${TAG_VERSION}-windows-arm64.exe" \
            "ps5upload-${TAG_VERSION}.elf"; do
            if [ ! -s "release/$name" ]; then
              echo "::error::release asset missing or empty: $name"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing expected release asset(s) missing — not creating the release"
            exit 1
          fi
          if [ ! -s "release/PS5Upload-${TAG_VERSION}-android.apk" ]; then
            echo "::warning::no Android APK in this release (build-android failed; it is not a gate)"
          fi
          if [ ! -s "release/PS5Upload-${TAG_VERSION}-ios-unsigned.ipa" ]; then
            echo "::warning::no iPhone IPA in this release (build-ios failed; it is not a gate)"
          fi
          echo "all expected release assets present"

      # Every file is scanned with ClamAV (current signatures) before anything is published,
      # and inside archives and installers too. A hit stops the release: nothing we ship should
      # match a known-malware signature. This only catches known signatures; a heuristic flag
      # from one vendor (#506) is a false positive to report to that vendor.
      # The virus-scan job has scanned the builds' files as they came; what it vouches for is
      # the exact bytes (SHA-256). Anything else here, or everything when that job failed, is
      # scanned below as before.
      - name: Files the virus-scan job did not cover
        id: unscanned
        run: |
          set -euo pipefail
          list="artifacts/clamav-scanned/scanned.sha256"
          [ -s "$list" ] || echo "::warning::no list from virus-scan: scanning every release file here"
          : > "$RUNNER_TEMP/unscanned"
          total=0
          left=0
          while IFS= read -r -d '' f; do
            total=$((total + 1))
            h="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ -s "$list" ] && grep -qxF "$h" "$list"; then
              continue
            fi
            printf '%s\0' "$f" >> "$RUNNER_TEMP/unscanned"
            echo "not scanned yet: $f"
            left=$((left + 1))
          done < <(find release -type f -print0)
          echo "$((total - left)) of $total release files were scanned by virus-scan; $left left"
          echo "count=$left" >> "$GITHUB_OUTPUT"

      - name: Install ClamAV
        if: steps.unscanned.outputs.count != '0'
        timeout-minutes: 20
        run: bash scripts/ci-apt-latest.sh clamav

      # A scan with no signatures, or with whatever the package happened to ship, passes
      # everything: the release stops here unless today's signatures are in place.
      - name: Fetch current ClamAV signatures
        if: steps.unscanned.outputs.count != '0'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          fresh=0
          for attempt in 1 2 3; do
            if sudo freshclam --quiet; then
              fresh=1
              break
            fi
            echo "freshclam attempt $attempt failed" >&2
            sleep 20
          done
          if [ "$fresh" -ne 1 ]; then
            echo "::error::freshclam failed 3 times: no current virus signatures, not scanning with stale ones"
            exit 1
          fi
          for db in main daily; do
            if ! compgen -G "/var/lib/clamav/$db.c?d" >/dev/null; then
              echo "::error::/var/lib/clamav has no $db.cvd or $db.cld after freshclam"
              ls -la /var/lib/clamav || true
              exit 1
            fi
          done
          ls -la /var/lib/clamav

      - name: Virus scan the release files (ClamAV)
        if: steps.unscanned.outputs.count != '0'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          clamscan --version
          scripts/release/clamscan-parallel.sh < "$RUNNER_TEMP/unscanned"

      # The release body is the CHANGELOG section for this version. The old
      # "See CHANGELOG.md" placeholder shipped whenever the entry was missing
      # (scripts/release.sh tags before the changelog is written if you forget
      # it), and a release with no notes is a release page nobody can read.
      - name: Extract release notes from CHANGELOG
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          notes="release/RELEASE_NOTES.md"
          awk -v ver="$TAG_VERSION" '
            $0 == "## " ver { found=1; next }
            found && $0 ~ "^## " { exit }
            found && $0 ~ "^---$" { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [ -z "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "::error::CHANGELOG.md has no '## $TAG_VERSION' section (or it is empty). Write the entry, then cut the next version — a pushed tag cannot be moved."
            exit 1
          fi
          echo "---RELEASE_NOTES.md---"
          cat "$notes"

      - name: Generate latest.json updater manifest
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/gen-updater-manifest.py \
            --release-dir release \
            --version "$TAG_VERSION" \
            --tag "$TAG_NAME" \
            --repo phantomptr/ps5upload \
            --notes release/RELEASE_NOTES.md \
            --out release/latest.json
          echo "---latest.json---"
          cat release/latest.json

      # The iOS source for AltStore / SideStore / Feather (#512): read from the .ipa, so it can
      # only describe what it links. `releases/latest/download/altstore.json` then always names
      # the newest promoted release. The last promoted release's file goes in too: it keeps the
      # older versions listed, and it stands in when this build has no .ipa (build-ios is not a
      # gate), because a promoted release without this file is a 404 for every source user.
      - name: Generate altstore.json iOS source
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          previous="$RUNNER_TEMP/previous-altstore.json"
          curl -fsSL --retry 3 --max-time 60 -o "$previous" \
            https://github.com/phantomptr/ps5upload/releases/latest/download/altstore.json \
            || echo "::warning::could not fetch the previous altstore.json"
          python3 -I scripts/gen-altstore-source.py \
            --ipa "release/PS5Upload-${TAG_VERSION}-ios-unsigned.ipa" \
            --tag "$TAG_NAME" \
            --repo phantomptr/ps5upload \
            --notes release/RELEASE_NOTES.md \
            --previous "$previous" \
            --out release/altstore.json
          if [ ! -s release/altstore.json ]; then
            echo "::warning::no altstore.json in this release: do not promote it, source users would lose updates"
          fi

      # The release page opens with which file to download: people took the engine-only
      # Windows exe for the app ("the app doesn't run"). Only the page gets this; the in-app
      # update notes (latest.json) and altstore.json were made from the CHANGELOG text above, and
      # the website drops the block between the markers (site/app.js lists downloads itself).
      - name: Move release notes out of assets dir
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            sed "s/@V@/${TAG_VERSION}/g" <<'EOF'
          <!-- downloads -->
          ### Which file do I download?

          | For | Download |
          |---|---|
          | Windows | `PS5Upload-@V@-win-x64-setup.exe` (ARM PCs: `PS5Upload-@V@-win-arm64-setup.exe`; to run without installing: `PS5Upload-@V@-win-x64.zip`) |
          | Mac | `PS5Upload-@V@-mac-arm64.dmg` (Apple Silicon) or `PS5Upload-@V@-mac-x64.dmg` (Intel) |
          | Linux | `PS5Upload-@V@-linux-x64.AppImage`, `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, Bazzite); ARM: the `linux-arm64` files |
          | Android | `PS5Upload-@V@-android.apk` (older 32-bit phones: `PS5Upload-@V@-android-armv7.apk`) |
          | iPhone | `PS5Upload-@V@-ios-unsigned.ipa`, installed with AltStore or Sideloadly (see the README) |
          | Engine only (servers, Docker, advanced) | `ps5upload-engine-@V@-<system>`: not the app, it has no window |

          <!-- /downloads -->

          EOF
            cat release/RELEASE_NOTES.md
          } > "$RUNNER_TEMP/RELEASE_NOTES.md"
          rm release/RELEASE_NOTES.md

      # After the manifests (the updater reads latest.json) and with the notes out, so the
      # attested files are exactly the ones the next step uploads.
      # A signed record that each file was built by this workflow from this tag, so anyone can
      # check a download is ours and untouched: gh attestation verify <file> -R phantomptr/ps5upload
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*

      # prerelease=false makes this release GitHub's "latest", which the stable updater
      # (releases/latest/download/latest.json), the iPhone source and the site all follow.
      # release-tag.yml only ever asks that for a version newer than every tag, but a hand
      # dispatch for an older tag would move all of them back: that one is published as a full
      # release and latest stays where it is. A lookup that fails is not a "no".
      - name: Never move latest to an older version
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_RELEASE: ${{ github.event.inputs.prerelease == 'false' }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$FULL_RELEASE" != true ]; then
            echo "make_latest=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          err="$RUNNER_TEMP/latest-lookup.err"
          latest_tag=""
          found=0
          for attempt in 1 2 3; do
            if latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$err")"; then
              found=1
              break
            fi
            if grep -q 'HTTP 404' "$err"; then
              latest_tag=""
              found=1
              break
            fi
            echo "latest release lookup failed (attempt $attempt):" >&2
            cat "$err" >&2
            sleep $((attempt * 10))
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::could not read the latest release (GitHub API error above); not publishing over it."
            exit 1
          fi
          latest="${latest_tag#v}"
          if [ -n "$latest" ] && [ "$latest" != "$TAG_VERSION" ] \
              && [ "$(printf '%s\n%s\n' "$TAG_VERSION" "$latest" | sort -V | head -n 1)" = "$TAG_VERSION" ]; then
            echo "::warning::$TAG_VERSION is older than the latest release ($latest_tag): published as a full release, latest stays on $latest_tag"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          draft: false
          # Every release ships as a PRE-RELEASE and is promoted by hand on
          # GitHub once it has been checked on real hardware. The old rule
          # (prerelease only when the tag had a "-") meant a plain vX.Y.Z tag
          # went straight to "Latest" the moment CI finished, with nobody
          # having run it on a console. Only a dispatch that says
          # prerelease=false (release-tag.yml, when asked) publishes it as the latest.
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: release/*

  # The site's release snapshot and iPhone source (pages.yml) are rebuilt once the release is out.
  # pages.yml also lists this workflow under `workflow_run`, but a publish run that release-tag.yml
  # dispatched with GITHUB_TOKEN raises no such event, so it is asked for here. Its own job, so
  # the token that can start workflows is not in the job that builds the release.
  refresh-site:
    name: refresh-site
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the site from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is out either way, and pages.yml runs daily: a refusal here is a warning.
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -f ref=main \
            || echo "::warning::could not start pages.yml; run it by hand (gh workflow run pages.yml --ref main) or wait for the daily deploy"

  # A release should end up published. One job that fails on something passing (a GitHub 504, a
  # busy runner disk, a runner GitHub never handed over) stops the whole release, so a failed
  # publish runs its failed jobs again, up to twice. A real error fails three times and stays
  # failed for a person to read.
  #
  # A run cannot re-run itself while it is running, so this only asks rerun-failed.yml to: that
  # workflow waits for this run to finish, then re-runs its failed jobs. This job is the only
  # thing that retries a publish run (two workflows doing it raced: "cannot be rerun; This
  # workflow is already running"). It is a dependent of create-release, so a re-run runs it again
  # with the next run_attempt.
  #
  # Not after a cancel (a newer dispatch for the same tag, or a person): `!cancelled()`.
  retry-failed:
    name: retry-failed
    needs: create-release
    if: ${{ !cancelled() && github.run_attempt < 3 && needs.create-release.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Ask rerun-failed.yml to re-run this run's failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ needs.create-release.result }}
        run: |
          set -euo pipefail
          echo "create-release: $CREATE_RELEASE (attempt $GITHUB_RUN_ATTEMPT of 3)"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/rerun-failed.yml/dispatches" \
            -f ref=main -f "inputs[run_id]=$GITHUB_RUN_ID"
          echo "- attempt $GITHUB_RUN_ATTEMPT failed; rerun-failed.yml will re-run the failed jobs" >> "$GITHUB_STEP_SUMMARY"
