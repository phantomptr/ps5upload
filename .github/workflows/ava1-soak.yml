name: ava1-soak

# Weekly host soak (review 009 #2c): whole jobs (mixed small and large uploads with cancel and resume,
# zip downloads, parked jobs reaped) against the real console C, built with ASan + UBSan + LSan, for
# an hour. After every round the data layer's counters must be back at baseline: job table empty,
# nothing unswept, no pack segments on disk, the open-descriptor count unchanged, memory bounded.
# Not part of the PR gate.

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to soak'
        default: '60'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install clang + sanitizer runtimes
        timeout-minutes: 20
        run: bash scripts/ci-apt.sh clang libclang-rt-18-dev

      - name: Soak
        working-directory: engine
        env:
          CC: clang
          AVA1_CTEST_SANITIZE: '1'
          RUSTFLAGS: -Clinker=clang
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/engine/crates/ps5upload-ctest/lsan.supp
          AVA1_SOAK_MINUTES: ${{ github.event.inputs.minutes || '60' }}
          AVA1_SOAK_RSS_MB: '512'
        run: cargo test -p ps5upload-ctest --test soak -- --ignored --test-threads=1 --nocapture
