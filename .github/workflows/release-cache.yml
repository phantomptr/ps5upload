name: release-cache

# Fills the compile cache publish.yml reads. A release is a tag run, and a cache a tag run
# saves is visible to that tag alone, so a release can never warm its own cache; it can read
# main's. This runs publish.yml's engine + desktop-dependency build
# (scripts/release/build-engine-release.sh) for each desktop target on main with sccache
# writing to the Actions cache, so the next release finds every dependency crate (and every
# unchanged first-party crate) compiled. The release itself builds identically with or
# without a hit: sccache keys each object by the full compiler command line and inputs.
#
# When: on main when the Rust code, its lockfiles or this build change (the batch PR that catches
# main up after a release touches engine/Cargo.lock, so each release refreshes it; the release's
# own bump commit lives on its tag, not main: its first-party crates, whose version changed,
# compile fresh, their dependencies still hit), weekly (a new stable rustc
# changes every key), by hand, and on a PR that changes this workflow or the build script
# (its own entries then live in that PR's scope).
#
# Size: sccache stores one cache entry per object and GitHub evicts the least recently used
# entries above the repository's 10 GiB. Read the entries' total with
#   gh api repos/phantomptr/ps5upload/actions/cache/usage
#
# What it is worth (measured 2026-11-17 over v12.6.0..v12.6.3): publish's Rust hit rate was
# 45-68 % when this run had finished before the release, 0-20 % when it ran alongside it (the
# usual case: the release is cut right after the merge that started this). Its own Linux legs hit
# 0 %, because ci's per-run caches push the pool past 10 GiB on every main push and evict the
# previous warm, and most of its writes fail with HTTP 429 (the cache service rate-limits ~1000
# entries a job). So it is a small help, not a guarantee, and release-tag.yml cancels a run still
# going when it dispatches publish, so the release gets its macOS and Linux runners.
#
# No Windows legs: sccache is off on Windows (see "Start sccache"), so they compiled for ~16 min
# each and stored nothing, holding two Windows runners while ci and publish queued for them.

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'client/src-tauri/**'
      - 'third_party/**'
      - 'scripts/release/build-engine-release.sh'
      - '.github/workflows/release-cache.yml'
  pull_request:
    paths:
      - 'scripts/release/build-engine-release.sh'
      - '.github/workflows/release-cache.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Must match publish.yml's: sccache hashes the CARGO_* environment into every key.
env:
  CARGO_TERM_COLOR: always

jobs:
  warm:
    name: warm ${{ matrix.rust_target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # publish.yml's build-client matrix: same runners, same targets, but not Windows (above).
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15
            platform: macos
            arch: x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      # publish.yml's Node: the build script reads tauri.conf.json with it on macOS.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cargo registry (restored by publish.yml)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('engine/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install sccache
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: sccache@0.18.0

      - name: Point sccache at the Actions cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            // The v2 cache service (the only one GitHub runs now); without this sccache's
            // backend speaks v1, and every read misses and every write fails.
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('SCCACHE_ERROR_LOG', `${process.env.RUNNER_TEMP}/sccache.log`);
            core.exportVariable('SCCACHE_LOG', 'warn');
            core.exportVariable('SCCACHE_GHA_ENABLED', 'true');
            core.exportVariable('SCCACHE_GHA_RW_MODE', 'READ_WRITE');
            core.exportVariable('SCCACHE_IGNORE_SERVER_IO_ERROR', '1');
            core.exportVariable('SCCACHE_IDLE_TIMEOUT', '0');

      # Not on Windows (no Windows legs here): since Rust 1.100's build-dir layout rustc gets one
      # -L per dependency, and sccache 0.18 starts rustc with the whole line, past Windows' limit
      # (os error 206). Cargo alone passes it in a response file. Bring the Windows legs back
      # (publish.yml's matrix, with its libclang step) once sccache does the same.
      - name: Start sccache
        shell: bash
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; building without the compile cache"
          fi

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Bounded and retried, as in publish.yml: scripts/ci-apt.sh puts each download attempt
          # on a 4-minute clock, leaves the Azure mirror after a failed one, and installs offline.
          bash scripts/ci-apt.sh \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2 \
            patchelf \
            build-essential \
            clang \
            libclang-dev \
            curl \
            wget \
            file \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-gl

      - name: Build engine + desktop dependencies (as publish.yml)
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: scripts/release/build-engine-release.sh

      - name: Compile cache stats
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          tail -n 20 "$RUNNER_TEMP/sccache.log" 2>/dev/null || true
