# CodeQL code scanning: injection, path traversal, unsafe deserialisation and the like in
# our own code. Findings go to the repository's Security tab (Code scanning) rather than
# failing the build, so a new alert is triaged instead of blocking an unrelated PR. The
# dependency and secret scan that does gate PRs is the `security scan` job in engine-ci.yml.
#
# The payload's C is not analysed here: it builds only with the PS5 Payload SDK.
#
# Off the critical path: neither `PR gate` (engine-ci.yml) nor release-tag.yml waits for this
# workflow, and it must not be made a required check (a PR that touches none of the paths below
# never gets one, and a merge-queue entry never runs it). It runs on every push to main, weekly,
# and on a pull request only when it changes code in one of the four languages analysed here; a
# PR of docs, templates or the website has nothing for it to read. Results still upload to the
# Security tab, and open alerts still stop scripts/release.sh.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    # actions, javascript-typescript, python, rust: their sources and the manifests that pull in
    # dependencies, plus this workflow and its config.
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/**"
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.html"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/*.py"
  schedule:
    # Weekly, so new CodeQL queries also run over code nobody touched.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: /language:${{ matrix.language }}

  # Fails when this change leaves an open code-scanning alert: a new finding is fixed (or, when it
  # is by design, dismissed with its reason) before it merges or ships. Already-dismissed alerts
  # don't count. Push and same-repo pull requests only (a fork's token cannot read the alerts).
  gate:
    name: codeql gate
    needs: analyze
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
    steps:
      - name: No open code-scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          # The uploads just made turn into analyses, then alerts, after a short delay: wait
          # until all four languages' analyses of this commit are in.
          for _ in $(seq 1 30); do
            n="$(gh api "repos/$REPO/code-scanning/analyses?ref=$REF&per_page=100" \
              --jq "[.[] | select(.commit_sha == \"$SHA\")] | map(.category) | unique | length")"
            [ "$n" -ge 4 ] && break
            sleep 20
          done
          # Fewer than four and the alert query below would pass on part of the picture.
          if [ "$n" -lt 4 ]; then
            echo "::error::only $n of 4 CodeQL analyses of $SHA arrived in time: re-run this job"
            exit 1
          fi
          sleep 20
          open="$(gh api --paginate "repos/$REPO/code-scanning/alerts?ref=$REF&state=open&per_page=100" \
            --jq '.[] | "\(.rule.id)  \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)  \(.html_url)"')"
          if [ -n "$open" ]; then
            echo "$open"
            echo "::error::open code-scanning alerts (above): fix them, or dismiss a by-design one with its reason"
            exit 1
          fi
          echo "no open code-scanning alerts"
