name: pages

# The website (site/) on GitHub Pages: https://phantomptr.github.io/ps5upload/
#
# The page reads GitHub's releases API live in the visitor's browser, so a new release shows
# up without a deploy. Each deploy also writes site/releases.json, the copy the page falls
# back on when the API can't be reached (offline, or GitHub's anonymous rate limit).
#
# When it deploys:
# - a change to site/ (or this file) on main;
# - after the publish workflow finishes;
# - once a day, so the snapshot never drifts far (this is what picks up a pre-release promoted
#   by hand; the page itself reads the releases API live, so visitors see it at once);
# - by hand (Actions → pages → Run workflow).

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site-releases.mjs", "scripts/site-i18n.mjs", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [publish]
    types: [completed]
  # No `release` trigger: that run's ref is the tag, and the github-pages environment only
  # deploys from main, so it was always rejected ("Tag ... is not allowed to deploy").
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          # Always the newest 22.x (security releases; the runner image can lag).
          check-latest: true
      - name: Every language has every string and its screenshots
        run: node scripts/site-i18n.mjs
      - name: Snapshot the releases (fallback for the page)
        run: node scripts/site-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
