# Re-runs CI jobs that failed on something outside the change.
#
# GitHub's hosted macOS (arm64) pool runs short at times; a job it cannot place is cancelled with
# no steps and the annotation "The job was not acquired by Runner of type hosted even after
# multiple attempts", and the PR gate then fails over a job that never started. An Ubuntu mirror
# that will not serve (scripts/ci-apt.sh: "apt could not download after 3 attempts") does the
# same to a job that had not compiled anything yet. This workflow looks at a finished `ci` run
# and re-runs its failed jobs only when scripts/release/gate-failures.mjs (main's copy, never the
# pull request's) says every failure is of that kind: verdict `infra`.
#
# Left for a person: any real failure (one real job beside ten starved ones keeps the run red),
# a run whose jobs were merely cancelled (a newer push), and a Playwright flaky-only result
# (`flaky`: CI fails on those on purpose so they are seen; scripts/release/merge-when-green.sh
# may re-run that once when someone is merging).
#
# It cannot loop: a run is re-run at most twice (nothing happens from attempt 3 on), and a
# re-run that fails for a real reason is `real` and ends it.
#
# Not `publish`: a publish run retries itself (its `retry-failed` job and rerun-failed.yml), for
# any failure, a starved runner included. Two workflows re-running the same run raced each other
# ("cannot be rerun; This workflow is already running").
name: ci-runner-retry

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run runs on the default branch: this is main's classifier, whatever the run was for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/release/gate-failures.mjs
          sparse-checkout-cone-mode: false

      - name: Re-run the failed jobs when nothing but infrastructure failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "Run $RUN_ID is on attempt $ATTEMPT; not retrying again."
            exit 0
          fi
          # A lookup that fails (exit 2) fails this job and re-runs nothing.
          out="$(node scripts/release/gate-failures.mjs "$RUN_ID" --attempt "$ATTEMPT" --repo "$REPO")"
          verdict="$(jq -r .verdict <<< "$out")"
          jq -r '.jobs[] | "\(.kind)\t\(.name): \(.reason)"' <<< "$out"
          if [ "$verdict" != infra ]; then
            echo "Verdict '$verdict': not an infrastructure-only failure, left for a person."
            exit 0
          fi
          echo "Re-running the failed jobs of run $RUN_ID (attempt $ATTEMPT): infrastructure only."
          if ! err="$(gh run rerun "$RUN_ID" --repo "$REPO" --failed 2>&1)"; then
            # Someone merging got there first (merge-when-green.sh): the same re-run, already going.
            case "$err" in
              *"already running"*) echo "It is already running again." ;;
              *) echo "::error::could not re-run run $RUN_ID: $err"; exit 1 ;;
            esac
          fi
