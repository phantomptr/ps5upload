# A release should end up published. One job that fails on something passing (a GitHub 504, a busy
# runner disk) stops the whole release, so a failed publish runs its failed jobs again, up to
# twice. A real error fails three times and stays failed for a person to read.
name: publish-retry

on:
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Run the failed jobs again
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
