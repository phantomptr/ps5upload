name: Bug report
description: Something in PS5Upload isn't working (for Remote Play, Play Together and installs there are forms of their own)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The fastest way to a fix: open **Bug Report** in the app's sidebar, press the button, and drag the zip it saves into this issue. It has the logs and your setup, and nothing private (no keys or passwords).
  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Connecting to the PS5 / the helper payload
        - Games library / launching / stopping games
        - Files (browse, copy, move, delete, mount)
        - Saves (backup, restore, copy)
        - Payloads (send, autoload, updates, Payload Manager)
        - Cheats
        - Console page on the PS5 (PS5Upload tile)
        - Hardware / temperatures / fan / power
        - Tailscale
        - Web UI (browser)
        - Phone app (Android / iOS)
        - AI agents (MCP)
        - Settings / updates / language
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include any error message or code exactly as shown (e.g. 0x80B2116F). A screenshot helps.
      placeholder: "When I ..., I expected ..., but ..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to make it happen again
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Once
  - type: input
    id: version
    attributes:
      label: PS5Upload version
      placeholder: "e.g. 12.0.0 (Help › About)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: The app runs on
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (ARM64)
        - Linux (x64)
        - Linux (ARM64)
        - Android
        - iOS / iPadOS
        - Browser (web UI or Docker engine)
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: PS5 model
      options:
        - PS5 (original / "phat")
        - PS5 Slim
        - PS5 Pro
        - Not sure
  - type: input
    id: firmware
    attributes:
      label: PS5 firmware
      placeholder: "e.g. 13.60"
  - type: textarea
    id: payloads
    attributes:
      label: Other payloads running on the PS5
      description: How you jailbroke, and anything else loaded (kstuff, etaHEN, ShadowMount+, Payload Manager, ftpsrv, ...), with versions if you know them.
  - type: textarea
    id: logs
    attributes:
      label: Logs (if you have no bug report zip)
      description: The error and a few lines around it from Activity & Logs.
      render: shell
