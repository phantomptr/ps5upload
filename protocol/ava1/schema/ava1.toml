# Management bodies. Most methods carry the payload handler's existing text/JSON in MgmtText;
# the filesystem, node and job methods are typed.
[[struct]]
name = "MgmtText"
fields = [{ name = "body", ty = "bytes" }]
ext = [{ tag = 1, name = "more", ty = "u8" }]     # 1 = call again with the next offset (paged methods)

[[struct]]
name = "NodeStatus"        # node.status; the handler's JSON minus the FTX2 transaction counters
fields = [
  { name = "version", ty = "str" },
  { name = "ps5_kernel", ty = "str" },
  { name = "instance_id", ty = "u64" },
  { name = "started_at_unix", ty = "u64" },
  { name = "command_count", ty = "u64" },
  { name = "startup_reason", ty = "u16" },
  { name = "ucred_elevated", ty = "u8" },
  { name = "max_transfer_streams", ty = "u8" },
  { name = "fan_threshold", ty = "u16" },
  { name = "fan_reapply_sec", ty = "u16" },
]
ext = [{ tag = 1, name = "prior_instance", ty = "str" }]   # "clean" | "killed_externally" | "wedged" | "stale" | "replaced"

[[struct]]
name = "FsList"
fields = [{ name = "path", ty = "str" }, { name = "offset", ty = "u32" }, { name = "limit", ty = "u16" }]

[[struct]]
name = "FsEntry"
fields = [{ name = "name", ty = "str" }, { name = "kind", ty = "u8" }, { name = "size", ty = "u64" }]
ext = [{ tag = 1, name = "mtime", ty = "u64" }, { tag = 2, name = "mode", ty = "u32" }]

[[struct]]
name = "FsListResult"
fields = [
  { name = "entries", ty = "records", of = "FsEntry" },
  { name = "total_scanned", ty = "u32" },
  { name = "more", ty = "u8" },
]

[[struct]]
name = "FsPath"
fields = [{ name = "path", ty = "str" }]

[[struct]]
name = "FsStat"
fields = [
  { name = "kind", ty = "u8" },
  { name = "size", ty = "u64" },
  { name = "mtime", ty = "u64" },
  { name = "mode", ty = "u32" },
  { name = "dev", ty = "u64" },
]

# fs.freespace: FsPath -> FsFreeSpace. What an upload may still fill on the drive holding `path`
# (the nearest existing ancestor is asked): `usable` is the free space the payload offers to a
# write, that is free less its small working margin `reserve` (the number its own capacity gate
# uses; never the hidden allocator pool, never the memory admit budget). `dev` names the
# volume so callers can tell drives apart.
[[struct]]
name = "FsFreeSpace"
fields = [
  { name = "usable", ty = "u64" },
  { name = "free", ty = "u64" },
  { name = "total", ty = "u64" },
  { name = "reserve", ty = "u64" },
  { name = "dev", ty = "u64" },
]

[[struct]]
name = "FsMkdir"
fields = [{ name = "path", ty = "str" }, { name = "mode", ty = "u32" }, { name = "parents", ty = "u8" }]

[[struct]]
name = "FsRename"
fields = [{ name = "from", ty = "str" }, { name = "to", ty = "str" }, { name = "overwrite", ty = "u8" }]

[[struct]]
name = "FsChmod"
fields = [{ name = "path", ty = "str" }, { name = "mode", ty = "u32" }]

[[struct]]
name = "FsRead"
fields = [
  { name = "path", ty = "str" },
  { name = "offset", ty = "u64" },
  { name = "len", ty = "u32" },
  { name = "flags", ty = "u32" },
]

[[struct]]
name = "FsReadResult"
fields = [{ name = "data", ty = "bytes" }, { name = "eof", ty = "u8" }]

[[struct]]
name = "FsWrite"          # fs.write; see SPEC.md §7.3 for the chunked protocol
fields = [
  { name = "path", ty = "str" },
  { name = "offset", ty = "u64" },
  { name = "flags", ty = "u32" },
  { name = "data", ty = "bytes" },
]
ext = [{ tag = 1, name = "mode", ty = "u32" }]   # permission bits applied at commit; absent = 0644

[[struct]]
name = "JobRun"
fields = [{ name = "job_id", ty = "b16" }, { name = "op", ty = "u8" }, { name = "args", ty = "bytes" }]

[[struct]]
name = "JobEntry"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "kind", ty = "u8" },
  { name = "state", ty = "u8" },
  { name = "files_done", ty = "u32" },
  { name = "files_total", ty = "u32" },
  { name = "bytes_done", ty = "u64" },
  { name = "bytes_total", ty = "u64" },
]

[[struct]]
name = "JobListResult"
fields = [{ name = "jobs", ty = "records", of = "JobEntry" }]

# Journal records (SPEC.md §14); never on the wire.
[[struct]]
name = "JnlOpen"
fields = [
  { name = "job_id", ty = "b16" },
  { name = "manifest_hash", ty = "b32" },
  { name = "kind", ty = "u8" },
  { name = "flags", ty = "u32" },
  { name = "staged", ty = "u8" },
  { name = "root", ty = "str" },
]

[[struct]]
name = "JnlBatch"
fields = [
  { name = "files", ty = "records", of = "FileRun" },
  { name = "ranges", ty = "records", of = "FileRange" },
  { name = "roots", ty = "records", of = "RootItem" },
]
# Durable-by-log (SPEC.md §15.7): present when the batch wrote small files to the pack log; the byte
# range of this batch's PackFile records inside segment `pack.<segment>`.
ext = [
  { tag = 1, name = "pack_segment", ty = "u32" },
  { tag = 2, name = "pack_offset", ty = "u64" },
  { tag = 3, name = "pack_len", ty = "u64" },
]

[[struct]]
name = "PackRef"            # where a batch's PackFile records live (journal snapshots only)
fields = [
  { name = "segment", ty = "u32" },
  { name = "offset", ty = "u64" },
  { name = "len", ty = "u64" },
  { name = "first_file", ty = "u32" },
  { name = "count", ty = "u32" },
]

[[struct]]
name = "JnlSweep"           # journal kind 6: these files are now durable in place
fields = [{ name = "files", ty = "records", of = "FileRun" }]

[[struct]]
name = "JnlReset"
fields = [{ name = "file_id", ty = "u32" }]

[[struct]]
name = "JnlSnapshot"
fields = [
  { name = "done", ty = "records", of = "FileRun" },
  { name = "ranges", ty = "records", of = "FileRange" },
  { name = "roots", ty = "records", of = "RootItem" },
]
# Records cannot be extensions, so these carry the records' item streams as bytes: `unswept` the
# FileRuns of done files not yet swept, `segments` the PackRefs whose files are not all swept.
ext = [
  { tag = 1, name = "unswept", ty = "bytes" },
  { tag = 2, name = "segments", ty = "bytes" },
]

[[struct]]
name = "JnlDone"
fields = [{ name = "status", ty = "u16" }]
