# ps5upload's AVA1 application schema: the management methods its helper serves (method
# numbers 4–15 and 32+, MGMT_METHODS.md) and their typed bodies. An extension of the AVA1
# core schema (third_party/ava1/schema/ava1.toml): after editing run `make ava1-app-gen`.
# Field types: u8 u16 u32 u64, b16 b32 (fixed bytes), bytes (u32 length), str (u16 length, UTF-8).

# ── Management RPCs (SPEC.md §7.3, MGMT_METHODS.md) ───────────────────────────
