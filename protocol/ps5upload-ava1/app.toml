value = 2
[[const]]
name = "ENTRY_OTHER"      # a device, socket, fifo, ...
ty = "u8"
value = 3
[[const]]
name = "ENTRY_UNKNOWN"    # the node could not stat the entry
ty = "u8"
value = 4
[[const]]
name = "FS_READ_MAX"      # largest FsRead.len
ty = "u32"
value = 262128
[[const]]
name = "FSW_CHUNK_MAX"    # largest FsWrite.data in one chunk (request cap 56 KiB minus path and header)
ty = "u32"
value = 49152
# FsRead.flags
[[const]]
name = "FSR_UNSAFE"       # read outside the writable roots (the engine sets it only for an unsafe read)
ty = "u32"
value = 1
# FsWrite.flags (SPEC.md §7.3, chunked write protocol)
[[const]]
name = "FSW_APPEND"      # write at the end of path.ps5upload.tmp (offset is ignored)
ty = "u32"
value = 1
[[const]]
name = "FSW_AT_OFFSET"   # write at `offset` of path.ps5upload.tmp (created empty if absent)
ty = "u32"
value = 2
[[const]]
name = "FSW_COMMIT"      # after this chunk: fsync the tmp file, then rename it over path (same directory)
ty = "u32"
value = 4
[[const]]
name = "FSW_CREATE"      # at commit, fail with ERR_EXISTS if path already exists
ty = "u32"
value = 8
[[const]]
name = "FSW_OVERWRITE"   # at commit, replace path if it exists (the default when neither is set)
ty = "u32"
value = 16

[[struct]]
name = "NodeStatus"        # node.status; the handler's JSON minus the FTX2 transaction counters
fields = [
  { name = "version", ty = "str" },
  { name = "ps5_kernel", ty = "str" },
  { name = "instance_id", ty = "u64" },
  { name = "started_at_unix", ty = "u64" },
  { name = "command_count", ty = "u64" },
  { name = "startup_reason", ty = "u16" },
  { name = "ucred_elevated", ty = "u8" },
  { name = "max_transfer_streams", ty = "u8" },
  { name = "fan_threshold", ty = "u16" },
  { name = "fan_reapply_sec", ty = "u16" },
]
ext = [{ tag = 1, name = "prior_instance", ty = "str" }]   # "clean" | "killed_externally" | "wedged" | "stale" | "replaced"

[[struct]]
name = "FsList"
fields = [{ name = "path", ty = "str" }, { name = "offset", ty = "u32" }, { name = "limit", ty = "u16" }]

[[struct]]
name = "FsEntry"
fields = [{ name = "name", ty = "str" }, { name = "kind", ty = "u8" }, { name = "size", ty = "u64" }]
ext = [{ tag = 1, name = "mtime", ty = "u64" }, { tag = 2, name = "mode", ty = "u32" }]

[[struct]]
name = "FsListResult"
fields = [
  { name = "entries", ty = "records", of = "FsEntry" },
  { name = "total_scanned", ty = "u32" },
  { name = "more", ty = "u8" },
]

[[struct]]
name = "FsPath"
fields = [{ name = "path", ty = "str" }]

[[struct]]
name = "FsStat"
fields = [
  { name = "kind", ty = "u8" },
  { name = "size", ty = "u64" },
  { name = "mtime", ty = "u64" },
  { name = "mode", ty = "u32" },
  { name = "dev", ty = "u64" },
]

# fs.freespace: FsPath -> FsFreeSpace. What an upload may still fill on the drive holding `path`
# (the nearest existing ancestor is asked): `usable` is the free space the payload offers to a
# write, that is free less its small working margin `reserve` (the number its own capacity gate
# uses; never the hidden allocator pool, never the memory admit budget). `dev` names the
# volume so callers can tell drives apart.
[[struct]]
name = "FsFreeSpace"
fields = [
  { name = "usable", ty = "u64" },
  { name = "free", ty = "u64" },
  { name = "total", ty = "u64" },
  { name = "reserve", ty = "u64" },
  { name = "dev", ty = "u64" },
]

[[struct]]
name = "FsMkdir"
fields = [{ name = "path", ty = "str" }, { name = "mode", ty = "u32" }, { name = "parents", ty = "u8" }]

[[struct]]
name = "FsRename"
fields = [{ name = "from", ty = "str" }, { name = "to", ty = "str" }, { name = "overwrite", ty = "u8" }]

[[struct]]
name = "FsChmod"
fields = [{ name = "path", ty = "str" }, { name = "mode", ty = "u32" }]

[[struct]]
name = "FsRead"
fields = [
  { name = "path", ty = "str" },
  { name = "offset", ty = "u64" },
  { name = "len", ty = "u32" },
  { name = "flags", ty = "u32" },
]

[[struct]]
name = "FsReadResult"
fields = [{ name = "data", ty = "bytes" }, { name = "eof", ty = "u8" }]

[[struct]]
name = "FsWrite"          # fs.write; see SPEC.md §7.3 for the chunked protocol
fields = [
  { name = "path", ty = "str" },
  { name = "offset", ty = "u64" },
  { name = "flags", ty = "u32" },
  { name = "data", ty = "bytes" },
]
ext = [{ tag = 1, name = "mode", ty = "u32" }]   # permission bits applied at commit; absent = 0644
