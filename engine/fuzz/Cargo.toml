# cargo-fuzz targets for every reader of a file a user could hand the engine (packages, disk
# images, pack indexes, param files). Its own workspace, not a member of ../Cargo.toml: it
# builds with sanitizer flags on a nightly toolchain, and the engine's builds, tests and CI
# never look at it. Laid out as ps5-dump-forge's fuzz/ is. See README.md.
#
#   cargo run --release -p ps5upload-fuzz-seedgen -- corpus     # seed corpora (stable)
#   cargo +nightly fuzz run exfat -- -max_total_time=60
[package]
name = "ps5upload-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[workspace]
members = [".", "seedgen"]
resolver = "2"

[dependencies]
libfuzzer-sys = "0.4"
ps5upload-fpkg = { path = "../crates/ps5upload-fpkg" }
ps5upload-pkg = { path = "../crates/ps5upload-pkg" }
ps5upload-core = { path = "../crates/ps5upload-core" }
ps5-dump-forge-pfs = { path = "../crates/ps5-dump-forge-pfs" }
ps5-dump-forge-zstd = { path = "../crates/ps5-dump-forge-zstd" }

[lib]
path = "src/lib.rs"

# The same patch as ../Cargo.toml: ps5upload-core depends on the vendored sevenz-rust2.
[patch.crates-io]
sevenz-rust2 = { path = "../../third_party/sevenz-rust2" }

[profile.release]
debug = 1

[[bin]]
name = "exfat"
path = "fuzz_targets/exfat.rs"
test = false
doc = false
bench = false

