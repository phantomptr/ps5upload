[package]
name = "ps5upload-fpkg"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
unicode-normalization = "0.1"
# Cross-platform OS randomness for the outer PFS seed. Opening /dev/urandom
# directly meant Windows silently fell back to the clock. Already in the tree.
getrandom = "0.4"
aes = "0.9"
# zlib-rs on purpose: the `.ffpfsc` wrap route writes plain zlib streams the PS5 kernel
# decodes, and only zlib's encoder never emits the code-length run spanning the literal
# and distance tables that the kernel misreads (ffpfsc_compat). The engine build got
# this backend transitively through `zip`; a build of this crate alone would not.
flate2 = { version = "1", features = ["zlib-rs"] }
# Smallest .ffpfsc: libdeflate's near-optimal parser (level 12) on blocks zlib 9 shrank. Plain
# C built by `cc`, like the vendored unrar, on every release target.
libdeflater = "1.26"
crc32fast = "1"
# Raw LZ4 blocks for AMPR asset packs (already in the tree through smb2).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
# AMPR pack profiles (drakmor's TOML format).
toml = "1"
hmac = "0.13"
sha2 = "0.11"
# Big-integer modular exponentiation for the debug license signature (pure Rust, every target).
num-bigint = "0.5"
ps5upload-pkg = { path = "../ps5upload-pkg" }
serde_json.workspace = true
libc = "0.2"
serde = { workspace = true }
sha3 = "0.12"
thiserror.workspace = true

[dev-dependencies]
# The exfat_read_bench example hashes files the way an image build's verify stage does.
blake3.workspace = true
