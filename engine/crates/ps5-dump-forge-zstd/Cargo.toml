[package]
name = "ps5-dump-forge-zstd"
# From PS5 Dump Forge by quer3q (https://github.com/quer3q/ps5-dump-forge), GPL-3.0-or-later, at
# commit 70b4884 (v0.5.4). Edition 2024 as upstream, so the files stay as they are there.
edition = "2024"
license = "GPL-3.0-or-later"
version.workspace = true

[features]
default = ["std"]
std = ["dep:getrandom", "dep:ps5upload-fpkg", "dep:rayon", "dep:zstd", "crc32fast/std"]

[dependencies]
crc32fast = { version = "1.5", default-features = false }
getrandom = { version = "0.4", optional = true }
ps5upload-fpkg = { path = "../ps5upload-fpkg", optional = true }
rayon = { version = "1.11", optional = true }
zstd = { version = "0.13.3", default-features = false, optional = true }

[[test]]
name = "roundtrip"
required-features = ["std"]
