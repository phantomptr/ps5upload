[package]
name = "ava1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "io-util", "rt"] }
blake2 = "0.11"
# Manifest hashes (SPEC.md §11.3); pinned by the workspace.
blake3.workspace = true
getrandom = "0.4"
# Frame AEAD: assembly ChaCha20-Poly1305 (NEON on aarch64/armv7, AVX2 on x86-64). Already
# in the tree through snow and rustls, so it builds for every shipped target.
ring = { version = "0.17", default-features = false }
snow = { version = "0.10", features = ["risky-raw-split"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
# The frame AEAD before ring: the differential oracle in tests/aead.rs.
chacha20poly1305 = "0.11"
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "io-util", "macros", "rt-multi-thread", "test-util"] }
ava1-chaos = { path = "../ava1-chaos" }
