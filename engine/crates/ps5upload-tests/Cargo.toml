[package]
name = "ps5upload-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
## Builds the live test binaries (tests/live_*.rs and the like): every test in them is
## `#[ignore]`d and needs a real console, disk image or network, so without this feature they are
## not built or listed at all. Run them with `cargo test -p ps5upload-tests --features live -- --ignored`.
live = []

[dev-dependencies]
anyhow.workspace = true
blake3.workspace = true
ps5upload-core = { path = "../ps5upload-core" }
# The AVA1 test console: the Rust job host and a scripted management node.
ava1.workspace = true
ava1-chaos.workspace = true
ps5upload-ava1 = { path = "../ps5upload-ava1" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
serde.workspace = true
serde_json.workspace = true
# Build .zip fixtures for the zip-transfer integration tests.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Build .7z fixtures for the 7z-transfer integration tests. The `compress`
# feature (encoder) is test-only and pure Rust (lzma-rust2/encoder); the
# production engine crate pins sevenz-rust2 with default-features=false.
sevenz-rust2 = { version = "0.23", features = ["compress"] }
crc32fast = "1"

[[test]]
name = "ava1_live"
required-features = ["live"]
