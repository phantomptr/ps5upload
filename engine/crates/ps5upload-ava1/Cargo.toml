[package]
name = "ps5upload-ava1"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
blake3.workspace = true
ava1.workspace = true
ps5upload-core = { path = "../ps5upload-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
crc32fast = "1"
# Same pin and feature set as ps5upload-core (decode only; the writer is a dev-dependency).
sevenz-rust2 = { version = "0.23", default-features = false }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress"] }
ava1-chaos.workspace = true
libc = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
# The tar tests write their archives (tar) and zstd frames (zstd's encoder); same versions as
# ps5upload-core's readers.
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.13.3", default-features = false }
