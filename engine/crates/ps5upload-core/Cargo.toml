[package]
name = "ps5upload-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# Cross-platform OS randomness for the Remote Play registration nonce. The old
# code opened /dev/urandom directly, which does not exist on Windows — the
# reported "opening /dev/urandom: os error 3" on Wake & sign in. Already in the
# tree via the dependency graph, so this pulls in no new code.
getrandom = "0.4"
base64 = "0.23"
blake3.workspace = true
# Content addressing for the backport library corpus (fakelibs.rs). Pure Rust,
# already in the lockfile via an existing transitive dependency, so this adds
# no new supply-chain surface and keeps the aarch64-linux-android cross-compile
# dependency-free.
sha2 = "0.11"
hmac = "0.13"
aes = "0.9"
# Remote Play stream (rp_stream): GMAC tags are AES-GCM with a 16-byte IV, and
# the stream key exchange is ECDH on secp256k1. Pure Rust, Android-clean.
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
k256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic"] }
cfb-mode = "0.9"
# The stream socket's receive buffer, on Windows too (std has no setter).
socket2 = "0.6"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
# Read .zip game dumps and stream-decompress them straight into the AVA1
# shard pipeline (transfer.rs `transfer_zip`). Deflate-only, matching the
# pin already vetted in client/src-tauri (save_archive.rs) — no bzip2/zstd
# C libs.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Read .7z game dumps (commonly a single .exfat image) the same way — host
# decompress + stream into the shard pipeline (transfer.rs `transfer_7z`).
# `default-features = false` keeps ONLY the always-on pure-Rust LZMA/LZMA2
# decoder (lzma-rust2) + crc32fast, dropping the optional bzip2 (C dep), aes/
# getrandom, ppmd, brotli and zstd defaults — so the dependency cross-compiles
# cleanly to aarch64-linux-android with no C toolchain. LZMA2 covers the
# overwhelming majority of real-world 7z game dumps; an archive using an
# unsupported codec fails with a clear "re-pack with LZMA2" message.
sevenz-rust2 = { version = "0.23", default-features = false }
# Community cheat search/download over HTTPS (cheats.rs). rustls + ring, which
# the engine already builds for Android, so this needs no C toolchain there.
ureq = { version = "3", features = ["rustls"] }
# Decode user-supplied avatar images (profile.rs). Pure-Rust decoders only
# (png/jpeg/webp/bmp/gif) — no C deps, so the Android cross-compile stays
# clean, same care as the zip/sevenz pins above. We hand-roll the bilinear
# resize + DXT5/DDS encode (ported to match the PS5 reference byte-for-byte),
# so only the decode + PNG re-encode sides of `image` are exercised.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# .rar game dumps (incl. multi-volume + AES password) are NOT read by a
# dependency here: UnRAR's license is GPL-incompatible, so it lives in the
# separate program `ps5upload-unrar` (crates/ps5upload-unrar), which the
# engine starts and talks to over pipes (src/rar_helper.rs). Do not add the
# `unrar` crate (or any crate that links UnRAR) to this crate or anything the
# engine/desktop binaries link: see LICENSES/UnRAR-exception.md. RAR stays
# desktop-only: the code is `#[cfg(not(target_os = "android"))]`.
