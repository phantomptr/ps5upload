[workspace]
exclude = ["crates/ava1/fuzz"]
members = [
  "crates/ava1",
  "crates/ava1-gen",
  "crates/ava1-chaos",
  "crates/ava1-ctest",
  "crates/ps5upload-core",
  "crates/ps5upload-lab",
  "crates/ps5upload-ava1",
  "crates/ps5upload-engine",
  "crates/ps5upload-pkg",
  "crates/ps5upload-fpkg",
  "crates/ps5upload-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "6.0.0"

[workspace.dependencies]
anyhow = "1.0"
# "multipart" is for the backport library import (fakelibs_api.rs): users pick
# library files and upload them as one set. Same crate, just the extractor.
axum = { version = "0.8", features = ["multipart"] }
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

# Speed up debug builds: thinner debug info on macOS, more parallelism.
[profile.dev]
split-debuginfo = "unpacked"

# The crypto, hash and compression crates run byte-at-a-time loops that are 10-50x slower
# unoptimized: a debug FPKG build of a few thousand files took 9 minutes on a CI runner,
# almost all of it inside these. Optimizing only them keeps our own code debuggable.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.sponge-cursor]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.inout]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.universal-hash]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Same for the release engine binary — not a shipped bundle, so trade a
# little size for faster link times.
[profile.release]
debug = false

# Vendored `unrar` with a one-line bounds fix in the volume-change callback.
# Upstream 0.5.8 reads ~8 KB out of a much smaller buffer on every volume
# transition, which aborts debug builds on any multi-part .rar and is a
# latent out-of-bounds read in release. 0.5.8 is the latest release, so
# there is nothing upstream to take. See third_party/unrar/README.md and
# docs/unrar-upstream-bug.md.
[patch.crates-io]
unrar = { path = "../third_party/unrar" }
