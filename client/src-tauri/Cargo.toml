[package]
name = "ps5upload-desktop"
version = "10.5.0"
description = "The all-in-one PS5 companion app."
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ps5upload_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Same version as engine/Cargo.toml (the third_party/ava1 submodule's tag).
ava1 = "=1.0.5"
# Tauri core + the native file dialogs. File reads/writes go through our
# own commands (see commands/save_text_file.rs), and links open through
# tauri-plugin-opener below.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
# Native OS notifications (system tray/center) — mirrors the in-app
# notification inbox to the desktop notification center and the Android
# notification shade. Cross-platform (macOS/Windows/Linux/Android/iOS).
tauri-plugin-notification = "2"
# Single-instance enforcement. Without it, double-clicking the desktop
# icon (or launching from a second shortcut) starts a second desktop
# process. Both probe :19113, the second's orphan-reaper kills the
# first's engine, and the first window is left talking to a dead
# sidecar. The plugin's callback fires in the *original* instance with
# the second-launch argv, so we can focus its window and let the
# duplicate exit cleanly. Desktop-only — mobile targets don't ship
# this path.
tauri-plugin-single-instance = "2"

# HTTP client for both the localhost engine sidecar (no TLS) and the
# public GitHub update manifest/asset downloads (needs TLS via
# rustls-tls). `stream` feature lets `update_download` stream bundles
# chunk-by-chunk instead of buffering hundreds of MB in RAM.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# `StreamExt` is what lets us await chunks out of `reqwest::Response::bytes_stream`.
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "time", "macros", "io-util", "sync"] }

# JSON (for both IPC payloads and on-disk persistence)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error plumbing
anyhow = "1"

# Cross-platform browser launcher for the `open_external` command.
open = "5"

# Gunzip the bundled payload (`ps5upload.elf.gz`) on first use — see
# `probes.rs::decompress_to_cache`. Pure-Rust miniz backend, no
# system-lib linkage, so cross-compilation to arm64/Windows stays simple.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# SHA-256 of a catalogue payload whose release publishes SHA256SUMS (commands/payloads.rs
# CHECKSUM_FILES). Same version the engine crates already pull in.
sha2 = "0.11"

# Engine core modules invoked directly in-process by Tauri commands
# (no HTTP hop). Same workspace, different manifest root.
ps5upload-core = { path = "../../engine/crates/ps5upload-core" }

# BLAKE3 for hash-stamping the extracted engine binary + payload.
# Replaces the previous full-byte compare on every launch — hashing
# the embedded bytes once (a few ms for ~14 MiB) and comparing
# against a 64-char hex stamp file is constant-time vs the file's
# size, and avoids the Windows file-lock issue (re-reading an .exe
# the OS has open elsewhere).
blake3 = "1"

# Base64 encoding for the file-preview Tauri command — the
# `commands/diagnostics.rs::fs_read_preview` returns the file bytes
# as base64 so the renderer can use them as a `data:` URL for image
# previews. Pure-Rust, no system deps.
base64 = "0.23"

# Save-data backup/restore as .zip archives. Pure-Rust deflate backend
# (no system zlib linkage) so cross-compilation stays single-toolchain.
# Default features pull in bzip2/zstd C libs we don't need — opt in to
# `deflate` only. Used from commands/save_archive.rs to zip a downloaded
# save folder into <title_id>.zip and validate/extract restore zips.
zip = { version = "9", default-features = false, features = ["deflate"] }

# mDNS service discovery for the Connection screen's "Find PS5s on the
# network" button. Pure-Rust implementation — no system avahi/bonjour
# linkage, so cross-compilation to all desktop targets (macOS arm64/x64,
# Windows x64/arm64, Linux x64/arm64) stays single-toolchain. Used only
# from `commands/discover.rs`; a discovery is a single 3-second LAN
# browse, not a long-running daemon.
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }

# Enumerate ALL local network interfaces (not just the default-route one) so
# the LAN sweep in commands/discover.rs probes every subnet the host is on —
# Ethernet + Wi-Fi + USB-tether simultaneously. Pure-Rust, cross-platform
# (macOS/Windows/Linux), no system linkage; keeps the single-toolchain
# cross-compile story intact.
if-addrs = "0.15"
tauri-plugin-opener = "2"

# libc for `statvfs` in the USB autoloader's drive enumeration
# (commands/usb_autoloader.rs). Already pulled in transitively via
# ps5upload-core, but listed explicitly here so a future change to
# core's deps doesn't silently remove our access.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop-only: PS5 screenshot (.jxr / JPEG XR) -> PNG conversion.
# `jpegxr` wraps Microsoft's BSD-licensed jxrlib C codec (decode-only)
# and bundles the C in-tree, compiling it with `cc` + generating bindings
# with `bindgen` (so the build host needs a C compiler + libclang —
# every desktop CI runner already has these). `image` encodes the
# tone-mapped pixels to PNG (png feature only — no extra format C libs).
#
# Gated to NON-mobile targets on purpose: this is the ONLY C-compiling
# dependency in the desktop crate, and we keep it off the Android/iOS
# builds so the mobile cross-compile story stays pure-Rust. Conversion
# is a desktop action (decode a downloaded screenshot on your computer);
# the command returns a clear "desktop only" error on mobile. Used from
# commands/screenshot_convert.rs.
# Desktop-only: drag a file out of Files onto the desktop (commands/dragout.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-drag = "2"
# Desktop-only: a DualSense's touchpad for Remote Play (commands/pad_touchpad.rs, #589); the
# Gamepad API has no fingers and WKWebView/WebKitGTK no WebHID. Backends picked so no system
# library is needed at build time: hid.dll directly on Windows, hidraw + a pure-Rust udev on
# Linux, IOKit on macOS (opened shared, so the system's own controller support keeps the pad).
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native-basic-udev", "macos-shared-device"] }
# Desktop-only: a DualSense's haptics for Remote Play (commands/pad_haptics.rs), played on the
# controller's USB audio device (channels 3 and 4). Apache-2.0. CoreAudio on macOS, WASAPI on
# Windows, ALSA on Linux (libasound2-dev to build, libasound.so.2 at run time).
cpal = "0.17"

[target.'cfg(not(any(target_os = "android", target_os = "ios", all(target_os = "windows", target_arch = "aarch64"))))'.dependencies]
jpegxr = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# 16-bit HDR PNGs with a cICP chunk (#448): `image`'s encoder cannot add chunks. Already in
# the tree through `image`.
png = "0.18"

# Mobile (Android/iOS): link the engine as a library and run it
# in-process (engine_mobile.rs). Desktop spawns it as a sidecar binary
# instead, so this dependency is mobile-only. `cfg(mobile)` isn't a
# cargo-known cfg, so gate on the concrete target OSes.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ps5upload-engine = { path = "../../engine/crates/ps5upload-engine" }

# Android-only: call the platform APIs needed for all-files storage access
# (Environment.isExternalStorageManager + the settings intent) from Rust.
# We capture the JavaVM ourselves in JNI_OnLoad and get the Application
# context via ActivityThread.currentApplication() — Tauri 2's Android
# backend does NOT initialize the ndk_context global, so we can't use it.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# iOS-only: make the WKWebView the first responder so controllers reach the page
# (commands/system_bars.rs focus_webview). Already in the tree through wry.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# Remote Play captures into Photos (commands/save_photos.rs): the completion blocks. Already in
# the tree through objc2's AppKit/UIKit crates.
block2 = "0.6"
# Linux: ask Feral GameMode (gamemoded) for full speed while Remote Play plays
# (commands/game_mode.rs). Already in the tree through tauri-plugin-notification
# (notify-rust), default features and all, so this adds no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Linux: game controllers read from /dev/input (commands/pad_native.rs), for a WebKitGTK built
# without libmanette, whose Gamepad API sees none. Pure Rust (ioctls through nix), no system
# library to build or run. MIT OR Apache-2.0.
evdev = "0.13"
# Linux: quit cleanly on SIGTERM / SIGINT / SIGHUP (quit_signals.rs). tokio is already a
# dependency; signal-hook-registry, which this feature adds, is already in the tree.
tokio = { version = "1", features = ["signal"] }
# Linux: the WebKitGTK version this process runs with (linux_gpu.rs). Already in the tree
# through wry.
webkit2gtk-sys = "2"

[features]
# Default: build Tauri-native (no custom features yet)
default = []

# Dev builds only (`make run-client`, `cargo test`, CI's clippy/test): the
# release profile below is untouched. Mirrors engine/Cargo.toml — line tables
# are enough for a backtrace, and dependencies (tauri, wry, tokio, the image
# crates) carry no debug info at all, which is most of what the linker chews
# through on every rebuild. Dependencies stay unoptimized on purpose; see the
# engine's note on why optimized deps broke timing-sensitive tests.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Thin LTO with the default codegen units, not fat LTO with one: this profile also builds the
# whole engine into the Android and iPhone apps, and fat LTO + codegen-units = 1 turned the
# last step of every release build into minutes of single-core work (the app crate alone took
# 3.5-5.3 min per desktop target on v9.4.1). Thin LTO keeps the cross-crate inlining that
# matters for a webview shell at a few percent of size; opt-level "s" still favours size.
lto = "thin"
opt-level = "s"
# `strip = true` removed deliberately. Stripping the desktop binary
# drops the PDB linkage on Windows and the dSYM pointers on macOS,
# which makes any post-release crash report impossible to
# symbolicate. The ~2 MB we'd save is negligible against webkit2gtk
# (~30 MB on Linux) and WebView2 (system-shared on Windows). If a
# future size crunch ever justifies stripping, scope it to specific
# packages via [profile.release.package.X] with `strip = true`.
panic = "abort"

# No `unrar` here: UnRAR runs as the separate `ps5upload-unrar` program (built in
# the engine workspace, embedded next to the engine by build.rs/engine.rs), never
# linked into this app or the engine. See LICENSES/UnRAR-exception.md.
[patch.crates-io]
# 32-bit fix: archive sizes stay u64 (third_party/sevenz-rust2/README.md, #434).
sevenz-rust2 = { path = "../../third_party/sevenz-rust2" }
