<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required on Android/iOS so the WebView
         exposes system-bar / display-cutout sizes via the CSS
         env(safe-area-inset-*) variables. Without it those are always 0
         and our top/bottom bars draw underneath the status bar and the
         gesture-nav pill (edge-to-edge is the default on Android 15+).
         Harmless on desktop, where the insets resolve to 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/logo-square.png" />
    <!-- A phone's Home Screen (the web UI served by the engine): the name and the icon (engine
         app_icon.rs; the desktop app never asks for them). -->
    <meta name="apple-mobile-web-app-title" content="PS5Upload" />
    <link rel="apple-touch-icon" href="/app-icon/apple-touch-icon.png" />
    <link rel="manifest" href="/app-icon/app.webmanifest" />
    <title>PS5 Upload</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Plain ES5, before the bundle: a notice instead of a white window on an old WebView (#352). -->
    <script src="./boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
